<!doctype html>
<html><head><title>Sheet Debug</title>
<style>
body { background: #333; color: #fff; font-family: monospace; padding: 20px; }
.row { display: flex; gap: 20px; margin-bottom: 30px; align-items: flex-start; }
canvas { image-rendering: pixelated; border: 1px solid #555; background: #222; }
.lbl { font-size: 12px; color: #aaa; margin-bottom: 4px; }
</style></head><body>

<h3>Walls (80×48, 5×3 tiles) — each grid cell is 16×16 source px, rendered at 6×</h3>
<canvas id="w" width="480" height="288"></canvas>
<h3>Roof (112×80, 7×5 tiles) — 6× scale</h3>
<canvas id="r" width="672" height="480"></canvas>
<h3>Trees (192×112, 12×7 tiles) — 4× scale</h3>
<canvas id="t" width="768" height="448"></canvas>
<h3>tree_sprites.png (576×192, 36×12 tiles) — 2× scale</h3>
<canvas id="ts" width="1152" height="384"></canvas>

<script>
function draw(canvasId, src, scale, cols, rows) {
  const c = document.getElementById(canvasId);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const img = new Image();
  img.onload = () => {
    g.drawImage(img, 0, 0, c.width, c.height);
    // Grid overlay
    g.strokeStyle = 'rgba(255,0,0,0.35)';
    g.lineWidth = 1;
    const cellW = c.width / cols, cellH = c.height / rows;
    for (let i = 0; i <= cols; i++) {
      g.beginPath(); g.moveTo(i * cellW, 0); g.lineTo(i * cellW, c.height); g.stroke();
    }
    for (let i = 0; i <= rows; i++) {
      g.beginPath(); g.moveTo(0, i * cellH); g.lineTo(c.width, i * cellH); g.stroke();
    }
    // Col/row labels
    g.fillStyle = 'rgba(255,255,0,0.8)';
    g.font = '14px monospace';
    for (let col = 0; col < cols; col++) g.fillText(col, col * cellW + 3, 14);
    for (let row = 0; row < rows; row++) g.fillText(row, 2, row * cellH + 28);
  };
  img.src = src;
}
draw('w', 'assets/sprout-lands/Tilesets/Building parts/Wooden_House_Walls_Tilset.png', 6, 5, 3);
draw('r', 'assets/sprout-lands/Tilesets/Building parts/Wooden_House_Roof_Tilset.png', 6, 7, 5);
draw('t', 'assets/sprout-lands/Objects/Trees, stumps and bushes.png', 4, 12, 7);
draw('ts', 'assets/sprout-lands/Objects/Tree animations/tree_sprites.png', 2, 36, 12);
</script>
</body></html>
