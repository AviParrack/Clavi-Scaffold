gotchas:
  - "v2.html is a single 4,333-line file. State lives in a global S object. Future builders should grep for `S\\.` to see how new state should be added (push into the const S = {...} initialiser, near line ~1117)"
  - "Time math primitives: yearToX, xToYear, DEEP_MIN, TIMELINE_END (TIMELINE_END is mutated after data load to extend past 2100 if any speculative nodes exceed it). Always use yearToX/xToYear, never the YEAR_SCALE constant directly"
  - "The keydown handler guards against typing in the search input via document.activeElement === document.getElementById('search'). Any new key binding should rely on that guard"
  - "Density precompute must happen AFTER loadData() — `buildScrubDensity()` is called inside `initScrubber()` which runs after loadData in init(). Don't move it earlier"
  - "scrubJumpToYear() calls stopPlay() if play is active. This is intentional — manual scrubbing should preempt automated playback. Don't 'fix' that"

decisions_and_reasoning:
  - "Picked time scrubber as the chunk because (a) it was explicitly listed as #2 in HANDOFF's What's Next, (b) it leverages existing infrastructure (playMode, playYear, yearToX, xToYear) so it's mostly wiring not invention, (c) it's a single bounded UI element with no risk of touching the layout engine, and (d) one chunk + commit + exit is the headless contract"
  - "Used log1p for density normalisation rather than linear because the Industrial era has ~50× the node count of any prehistoric millennium and a linear scale produced visually dead prehistory bars. Log keeps every era's relative shape readable while still showing modern density is dramatically higher"
  - "Triangle handle on top edge points DOWN into the strip rather than up out of it — keeps the chrome contained and avoids overlap with hover tooltip which appears above the strip"
  - "240 bins chosen as the bin count: fine enough that adjacent decades read as distinct on a 1080p screen at the modern end of the timeline, coarse enough that the smoothing kernel can hide noise in sparse stretches. Each bin = ~13,750 years across the full DEEP_MIN→TIMELINE_END range"
  - "scrubVisible defaults to true rather than false because Avi will see the new feature on first load without having to discover the T key"

