          const x = (i / Math.max(numBuckets - 1, 1)) * svgW;
          const y = svgH - (v / maxVal) * (svgH - 2) - 1;
          return `${x},${y}`;
        }).join(' ');

        // Area fill path
        const areaPath = `M0,${svgH} ` +
          buckets.map((v, i) => {
            const x = (i / Math.max(numBuckets - 1, 1)) * svgW;
            const y = svgH - (v / maxVal) * (svgH - 2) - 1;
            return `L${x},${y}`;
          }).join(' ') +
          ` L${svgW},${svgH} Z`;

        return `
          <div class="spark-row ${isDormant ? 'dormant' : ''}">
            <div class="spark-name" title="${esc(p.name)}">${esc(p.name)}</div>
            <svg class="spark-chart" viewBox="0 0 ${svgW} ${svgH}" preserveAspectRatio="none">
              ${sparkFill ? `<path d="${areaPath}" fill="var(--green)" opacity="0.25" />` : ''}
              <polyline points="${points}" fill="none" stroke="var(--green)" stroke-width="1.5" />
            </svg>
          </div>
        `;
      }).join('');
    }

    // ─── PROJECTS ───
    function renderProjects() {
      const projects = DATA.groupsByProject;
      document.getElementById('project-count-label').textContent = projects.length + ' total';

      // Populate project filter dropdown (used by activity grid)
      const filter = document.getElementById('grid-project-filter');
      const currentVal = filter.value;
      const sorted = [...projects].sort((a, b) => b.lastTimestamp - a.lastTimestamp);
      filter.innerHTML = '<option value="all">ALL PROJECTS</option>' +
        sorted.map(p => `<option value="${esc(p.name)}" ${currentVal === p.name ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

      renderTreemap();
      renderSparklines();
    }

    // ─── ACTIVITY GRID ───
    let gridRange = 'month'; // day, week, month, all
    let gridPickedDate = null; // for day mode

    // ─── TERMINAL STATE ───
    let term = null;
    let fitAddon = null;
    let ws = null;
    let currentSessionId = null;
    let currentProjectPath = null;
    let currentMode = 'claude';
    let refreshInterval = null;

    function renderActivityGrid() {
      const notes = DATA.notes.filter(n => n.firstTimestamp);
      const filterProject = document.getElementById('grid-project-filter').value;

      const now = new Date();
      const slots = [];
      let slotMode = 'hour'; // hour or day

      if (gridRange === 'day') {
        // 24 hourly slots for a specific day
        const base = gridPickedDate ? new Date(gridPickedDate) : now;
        for (let h = 0; h < 24; h++) {
          const d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h);
          slots.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(h).padStart(2,'0')}`);
        }
        slotMode = 'hour';
      } else if (gridRange === 'week') {
        // 7 * 24 = 168 hourly slots
        for (let i = 7 * 24 - 1; i >= 0; i--) {
          const d = new Date(now.getTime() - i * 3600000);
          slots.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}`);
        }
        slotMode = 'hour';
      } else if (gridRange === 'month') {
        // 30 * 24 hourly slots
        for (let i = 30 * 24 - 1; i >= 0; i--) {
          const d = new Date(now.getTime() - i * 3600000);
          slots.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}`);
        }
        slotMode = 'hour';
      } else {
        // All time — daily slots
        const firstTs = Math.min(...notes.map(n => n.firstTimestamp));
        const startDate = new Date(firstTs);
        startDate.setHours(0, 0, 0, 0);
        const endDate = new Date(now);
        endDate.setHours(0, 0, 0, 0);
        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
          slots.push(dayKey(d.getTime()));
        }
        slotMode = 'day';
      }

      // Aggregate by slot
      const slotData = {};
      slots.forEach(s => { slotData[s] = { sessions: 0, chars: 0, files: 0, tokens: 0 }; });

      function hourKey(ts) {
        const d = new Date(ts);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}`;
      }

      for (const n of notes) {
        const key = slotMode === 'hour' ? hourKey(n.firstTimestamp) : dayKey(n.firstTimestamp);
        if (!slotData[key]) continue;
        if (filterProject !== 'all' && n.subfolder !== filterProject) continue;
        slotData[key].sessions += 1;
        slotData[key].chars += (n.charsAdded || 0) + (n.charsRemoved || 0);
        slotData[key].files += n.filesTouched || 0;
        slotData[key].tokens += (n.outputTokens || 0);
      }

      // Compute levels (quartiles)
      const values = slots.map(s => slotData[s][gridMetric]).filter(v => v > 0);
      values.sort((a, b) => a - b);
      const q1 = values[Math.floor(values.length * 0.25)] || 1;
      const q2 = values[Math.floor(values.length * 0.5)] || 2;
      const q3 = values[Math.floor(values.length * 0.75)] || 3;

      function level(v) {
        if (v === 0) return 0;
        if (v <= q1) return 1;
        if (v <= q2) return 2;
        if (v <= q3) return 3;
        return 4;
      }

      const metricCls = gridMetric === 'chars' ? 'metric-chars' : gridMetric === 'files' ? 'metric-files' : '';

      const gridEl = document.getElementById('activity-grid');

      // Per-mode layout strategy
      const availW = gridEl.parentElement.clientWidth - 32;
      if (gridRange === 'day') {
        gridEl.classList.add('grid-mode');
        gridEl.style.gridTemplateColumns = `repeat(24, 1fr)`;
        gridEl.style.gridAutoRows = '8px';
      } else if (gridRange === 'week') {
        gridEl.classList.add('grid-mode');
        gridEl.style.gridTemplateColumns = `repeat(24, 1fr)`;
        gridEl.style.gridAutoRows = '8px';
      } else if (gridRange === 'month') {
        gridEl.classList.remove('grid-mode');
        gridEl.style.gridTemplateColumns = '';
        gridEl.style.gridAutoRows = '';
      } else {
        // All time: fit all daily slots into available space
        const cols = Math.min(slots.length, Math.floor(availW / 6));
        const rows = Math.ceil(slots.length / cols);
        const rowH = Math.max(4, Math.min(8, Math.floor(140 / rows) - 2));
        gridEl.classList.add('grid-mode');
        gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        gridEl.style.gridAutoRows = `${rowH}px`;
      }

      gridEl.innerHTML = slots.map(s => {
        const v = slotData[s][gridMetric];
        const l = level(v);
        if (slotMode === 'hour') {
          const day = s.split('T')[0];
          const hour = s.split('T')[1];
          return `<div class="grid-cell ${metricCls}" data-level="${l}" data-day="${day}" data-hour="${hour}" data-value="${v}"></div>`;
        } else {
          return `<div class="grid-cell ${metricCls}" data-level="${l}" data-day="${s}" data-value="${v}"></div>`;
        }
      }).join('');

      // Labels
      const monthsEl = document.getElementById('grid-months');
      const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      let lastLabel = '';
      const labels = [];

      if (slotMode === 'hour' && gridRange === 'day') {
        // Show hour labels
        for (let h = 0; h < 24; h += 3) {
          labels.push(`${String(h).padStart(2,'0')}:00`);
        }
      } else if (slotMode === 'hour') {
        // Show evenly spaced date labels
        const allDays = [];
        for (const s of slots) {
          const parts = s.split('T');
          if (parts[1] === '00') {
            const mm = parseInt(parts[0].split('-')[1]);
            const dd = parseInt(parts[0].split('-')[2]);
            allDays.push(`${mm}/${dd}`);
          }
        }
        const maxLabels = Math.floor(availW / 45);
        const step = Math.max(1, Math.ceil(allDays.length / maxLabels));
        for (let i = 0; i < allDays.length; i += step) {
          labels.push(allDays[i]);
        }
      } else {
        // Daily mode — show ~12-15 evenly spaced labels
        const maxLabels = Math.floor(availW / 45);
        const step = Math.max(1, Math.ceil(slots.length / maxLabels));
        for (let i = 0; i < slots.length; i += step) {
          const s = slots[i];
          const mm = parseInt(s.split('-')[1]);
          const dd = parseInt(s.split('-')[2]);
          labels.push(`${mm}/${dd}`);
        }
      }
      monthsEl.style.display = 'flex';
      monthsEl.style.justifyContent = 'space-between';
      monthsEl.innerHTML = labels.map(l => `<span>${l}</span>`).join('');

      // Tooltip
      const tooltip = document.getElementById('grid-tooltip');
      gridEl.querySelectorAll('.grid-cell').forEach(cell => {
        cell.addEventListener('mouseenter', (e) => {
          const day = cell.dataset.day;
          const hour = cell.dataset.hour;
          const val = cell.dataset.value;
          let metricLabel = gridMetric === 'sessions' ? `${val} sessions` :
                      gridMetric === 'chars' ? `${formatNum(parseInt(val))} chars` :
                      gridMetric === 'tokens' ? `${formatNum(parseInt(val))} tokens` :
                      `${val} files`;
          const timeLabel = hour ? `${day} ${hour}:00` : day;
          tooltip.textContent = `${timeLabel} — ${metricLabel}`;
          tooltip.style.display = 'block';
          tooltip.style.left = (e.clientX + 10) + 'px';
          tooltip.style.top = (e.clientY - 24) + 'px';
        });
        cell.addEventListener('mouseleave', () => {
          tooltip.style.display = 'none';
        });
      });
    }

    // ─── GRID CONTROLS ───
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('grid-btn') && e.target.dataset.metric) {
        document.querySelectorAll('.grid-btn[data-metric]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        gridMetric = e.target.dataset.metric;
        renderActivityGrid();
      }
    });

    document.getElementById('grid-project-filter').addEventListener('change', () => {
      renderActivityGrid();
    });

    // Session controls
    document.getElementById('session-search').addEventListener('input', (e) => {
      sessionSearch = e.target.value;
      renderSessions();
    });

    // Custom dropdown logic
    function initCustomSelect(wrapId, onChange) {
      const wrap = document.getElementById(wrapId);
      if (!wrap) return;
      const trigger = wrap.querySelector('.custom-select-trigger');
      const options = wrap.querySelector('.custom-select-options');

      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        // Close all other dropdowns
        document.querySelectorAll('.custom-select.open').forEach(s => { if (s !== wrap) s.classList.remove('open'); });
        wrap.classList.toggle('open');
      });

      options.addEventListener('click', (e) => {
        const opt = e.target.closest('.custom-select-option');
        if (!opt) return;
        const val = opt.dataset.value;
        trigger.textContent = opt.textContent;
        options.querySelectorAll('.custom-select-option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        wrap.classList.remove('open');
        onChange(val);
      });
    }

    // Close dropdowns on outside click
    document.addEventListener('click', () => {
      document.querySelectorAll('.custom-select.open').forEach(s => s.classList.remove('open'));
    });

    initCustomSelect('session-sort-wrap', (val) => {
      sessionSort = val;
      renderSessions();
    });

    initCustomSelect('session-project-filter-wrap', (val) => {
      sessionProjectFilter = val;
      renderSessions();
    });

    // Range buttons
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('range-btn')) {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        gridRange = e.target.dataset.range;
        const picker = document.getElementById('grid-date-picker');
        if (gridRange === 'day') {
          picker.style.display = '';
          const today = dayKey(Date.now());
          picker.max = today;
          if (!gridPickedDate) {
            picker.value = today;
            gridPickedDate = today;
          }
        } else {
          picker.style.display = 'none';
        }
        renderActivityGrid();
      }
    });

    document.getElementById('grid-date-picker').addEventListener('change', (e) => {
      gridPickedDate = e.target.value;
      renderActivityGrid();
    });

    function esc(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── TERMINAL ───
    function openTerminal(session) {
      currentSessionId = session.sessionId;
      currentProjectPath = session.projectPath || null;

      // Highlight active session card
      document.querySelectorAll('.session-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.querySelector(`.session-card[data-session-id="${session.sessionId}"]`);
      if (activeCard) activeCard.classList.add('active');

      // Show terminal, hide center column, move terrain+heatmap to right column
      const centerCol = document.getElementById('center-column');
      const rightCol = document.getElementById('right-column');
      const terrainEl = document.getElementById('terrain-panel');
      const heatmapEl = document.getElementById('right-bottom');
      centerCol.classList.add('hidden');
      terrainEl.classList.add('in-sidebar');
      rightCol.insertBefore(heatmapEl, rightCol.firstChild);
      rightCol.insertBefore(terrainEl, rightCol.firstChild);
      document.getElementById('terminal-panel').classList.add('open');
      document.getElementById('left-panel').classList.add('collapsed');
      document.getElementById('right-column').classList.add('compressed');
      document.getElementById('terminal-session-name').textContent =
        `${session.subfolder} — ${session.name}`.slice(0, 80);

      // Initialize terminal
      if (term) term.dispose();

      term = new Terminal({
        fontFamily: "'IBM Plex Mono', monospace",
        fontSize: 13,
        theme: {
          background: '#0c0c10',
          foreground: '#c8c8c8',
          cursor: '#00cc66',
          cursorAccent: '#0c0c10',
          selectionBackground: '#00cc6640',
          black: '#0a0a0f',
          red: '#cc3344',
          green: '#00cc66',
          yellow: '#ccaa33',
          blue: '#44aacc',
          magenta: '#aa44cc',
          cyan: '#44aacc',
          white: '#c8c8c8',
          brightBlack: '#6a6a7a',
          brightRed: '#ff4466',
          brightGreen: '#33ff99',
          brightYellow: '#ffcc44',
          brightBlue: '#66ccee',
          brightMagenta: '#cc66ee',
          brightCyan: '#66ccee',
          brightWhite: '#e8e8e8',
        },
        cursorBlink: true,
        cursorStyle: 'block',
        scrollback: 5000,
        allowProposedApi: true,
      });

      fitAddon = new FitAddon();
      term.loadAddon(fitAddon);
      term.loadAddon(new WebLinksAddon());

      const container = document.getElementById('terminal-container');
      container.innerHTML = '';
      term.open(container);

      requestAnimationFrame(() => {
        fitAddon.fit();
        connectTerminal();
      });

      term.onData(data => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data }));
        }
      });

      // Clipboard: Ctrl+C copies if text selected, otherwise sends interrupt
      // Ctrl+V always pastes from clipboard
      term.attachCustomKeyEventHandler((e) => {
        if (e.ctrlKey && !e.shiftKey && e.key === 'c' && e.type === 'keydown') {
          const sel = term.getSelection();
          if (sel) {
            navigator.clipboard.writeText(sel);
            term.clearSelection();
            return false; // don't send to PTY
          }
          return true; // no selection — send interrupt
        }
        if (e.ctrlKey && !e.shiftKey && e.key === 'v' && e.type === 'keydown') {
          navigator.clipboard.readText().then(text => {
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'input', data: text }));
            }
          });
          return false;
        }
        return true;
      });

      // Start periodic refresh (every 10 minutes)
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          triggerRefresh();
        }
      }, 10 * 60 * 1000);
    }

    function connectTerminal() {
      const statusEl = document.getElementById('terminal-status');
      if (ws) ws.close();

      const params = new URLSearchParams({ mode: currentMode });
      if (currentSessionId) params.set('sessionId', currentSessionId);
      if (currentProjectPath) params.set('projectPath', currentProjectPath);

      ws = new WebSocket(`ws://${location.host}?${params}`);

      ws.onopen = () => {
        statusEl.textContent = 'CONNECTED';
        statusEl.className = 'terminal-status connected';
        if (fitAddon) {
          const dims = fitAddon.proposeDimensions();
          if (dims) ws.send(JSON.stringify({ type: 'resize', cols: dims.cols, rows: dims.rows }));
        }
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'output') {
            term.write(msg.data);
          } else if (msg.type === 'exit') {
            term.write(`\r\n\x1b[33m[process exited with code ${msg.code}]\x1b[0m\r\n`);
            statusEl.textContent = 'EXITED';
            statusEl.className = 'terminal-status disconnected';
            document.getElementById('reconnect-btn').style.display = '';
          } else if (msg.type === 'error') {
            term.write(`\r\n\x1b[31m[error: ${msg.message}]\x1b[0m\r\n`);
            document.getElementById('reconnect-btn').style.display = '';
          } else if (msg.type === 'data-refresh') {
            DATA = msg.sessions;
            render();
            document.getElementById('refresh-status').classList.remove('active');
          }
        } catch (e) {
          term.write(event.data);
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'DISCONNECTED';
        statusEl.className = 'terminal-status disconnected';
      };

      ws.onerror = () => {
        statusEl.textContent = 'ERROR';
        statusEl.className = 'terminal-status disconnected';
      };
    }

    // Exposed as globals for onclick handlers
    window.closeTerminal = function() {
      if (ws) ws.close();
      if (term) { term.dispose(); term = null; }
      if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }

      document.getElementById('terminal-panel').classList.remove('open');
      // Move terrain+heatmap back to center column
      const centerCol = document.getElementById('center-column');
      const terrainEl = document.getElementById('terrain-panel');
      const heatmapEl = document.getElementById('right-bottom');
      terrainEl.classList.remove('in-sidebar');
      centerCol.appendChild(terrainEl);
      centerCol.appendChild(heatmapEl);
      centerCol.classList.remove('hidden');
      document.getElementById('left-panel').classList.remove('collapsed');
      document.getElementById('right-column').classList.remove('compressed');
      document.querySelectorAll('.session-card').forEach(c => c.classList.remove('active'));
      currentSessionId = null;
      currentProjectPath = null;
    };

    window.reconnectTerminal = function() {
      if (term) {
        term.clear();
        document.getElementById('reconnect-btn').style.display = 'none';
        connectTerminal();
      }
    };

    window.switchMode = function(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.mode === mode);
      });
      document.getElementById('terminal-title').textContent =
        mode === 'claude' ? 'CLAUDE CODE' : 'TERMINAL';
      if (term && currentSessionId) {
        term.clear();
        connectTerminal();
      }
    };

    function triggerRefresh() {
      document.getElementById('refresh-status').classList.add('active');
      fetch('/refresh-data', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
          if (!data.ok) console.error('[refresh] error:', data.error);
          // Actual data update comes via WebSocket broadcast
        })
        .catch(e => {
          console.error('[refresh] fetch error:', e);
          document.getElementById('refresh-status').classList.remove('active');
        });
    }

    // ─── RESIZE OBSERVER FOR TERMINAL ───
    const termResizeObserver = new ResizeObserver(() => {
      if (fitAddon && term) {
        fitAddon.fit();
        if (ws && ws.readyState === WebSocket.OPEN) {
          const dims = fitAddon.proposeDimensions();
          if (dims) ws.send(JSON.stringify({ type: 'resize', cols: dims.cols, rows: dims.rows }));
        }
      }
    });
    termResizeObserver.observe(document.getElementById('terminal-container'));

    // ─── CONFIG PANEL ───
    const FONTS = [
      { name: 'IBM Plex Mono', family: "'IBM Plex Mono', monospace", category: 'mono' },
      { name: 'JetBrains Mono', family: "'JetBrains Mono', monospace", category: 'mono' },
      { name: 'Fira Code', family: "'Fira Code', monospace", category: 'mono' },
      { name: 'Source Code Pro', family: "'Source Code Pro', monospace", category: 'mono' },
      { name: 'Roboto Mono', family: "'Roboto Mono', monospace", category: 'mono' },
      { name: 'Space Mono', family: "'Space Mono', monospace", category: 'mono' },
      { name: 'Inconsolata', family: "'Inconsolata', monospace", category: 'mono' },
      { name: 'Inter', family: "'Inter', sans-serif", category: 'sans' },
      { name: 'Space Grotesk', family: "'Space Grotesk', sans-serif", category: 'sans' },
      { name: 'DM Sans', family: "'DM Sans', sans-serif", category: 'sans' },
      { name: 'Outfit', family: "'Outfit', sans-serif", category: 'sans' },
      { name: 'Geist Sans', family: "'Geist', sans-serif", category: 'sans' },
    ];

    // Load Google Fonts
    const googleFonts = FONTS.filter(f => f.name !== 'Geist Sans')
      .map(f => f.name.replace(/ /g, '+')).join('&family=');
    const fontLink = document.createElement('link');
    fontLink.rel = 'stylesheet';
    fontLink.href = `https://fonts.googleapis.com/css2?family=${googleFonts}&display=swap`;
    document.head.appendChild(fontLink);

    let currentFont = FONTS[0].name;

    function buildConfigPanel() {
      const panel = document.getElementById('config-panel');
      const sectionLabel = panel.querySelector('.config-section-label');

      // Monospace section
      const monoFonts = FONTS.filter(f => f.category === 'mono');
      const sansFonts = FONTS.filter(f => f.category === 'sans');

      let html = '';

      monoFonts.forEach(f => {
        html += `<div class="config-font-option ${f.name === currentFont ? 'active' : ''}" data-font="${f.name}" data-family="${f.family}">
          <span class="config-font-name" style="font-family:${f.family}">${f.name}</span>
          <span class="config-font-preview" style="font-family:${f.family}">Aa 01</span>
        </div>`;
      });

      html += `<div class="config-section-label">Sans-Serif</div>`;

      sansFonts.forEach(f => {
        html += `<div class="config-font-option ${f.name === currentFont ? 'active' : ''}" data-font="${f.name}" data-family="${f.family}">
          <span class="config-font-name" style="font-family:${f.family}">${f.name}</span>
          <span class="config-font-preview" style="font-family:${f.family}">Aa 01</span>
        </div>`;
      });

      // Viz config section
      html += `<div class="config-section-label">Viz Colors</div>`;

      html += `<div class="config-viz-row">
        <span class="config-viz-label">Border</span>
        <input type="color" id="cfg-border-color" value="${VIZ_CFG.borderColor}">
      </div>`;

      html += `<div class="config-viz-row">
        <span class="config-viz-label">Fill opacity</span>
        <input type="range" id="cfg-fill-opacity" min="0" max="1" step="0.05" value="${VIZ_CFG.fillOpacity}">
      </div>`;

      html += `<div class="config-viz-row">
        <span class="config-viz-label">Border opacity</span>
        <input type="range" id="cfg-border-opacity" min="0" max="1" step="0.05" value="${VIZ_CFG.borderOpacity}">
      </div>`;

      html += `<div class="config-viz-row">
        <span class="config-viz-label">Line width</span>
        <input type="range" id="cfg-line-width" min="0" max="3" step="0.1" value="${VIZ_CFG.lineWidth}">
      </div>`;

      html += `<div class="config-viz-row">
        <span class="config-viz-label">Texture opacity</span>
        <input type="range" id="cfg-texture-opacity" min="0" max="1" step="0.05" value="${VIZ_CFG.textureOpacity}">
      </div>`;

      // Global theme colors
      html += `<div class="config-section-label">Theme Colors</div>`;
      const themeColors = [
        { key: '--green', label: 'Accent', val: rootStyle.getPropertyValue('--green').trim() },
        { key: '--red', label: 'Negative', val: rootStyle.getPropertyValue('--red').trim() },
        { key: '--cyan', label: 'Info', val: rootStyle.getPropertyValue('--cyan').trim() },
        { key: '--bg', label: 'Background', val: rootStyle.getPropertyValue('--bg').trim() },
        { key: '--bg-card', label: 'Card bg', val: rootStyle.getPropertyValue('--bg-card').trim() },
        { key: '--text', label: 'Text', val: rootStyle.getPropertyValue('--text').trim() },
        { key: '--text-dim', label: 'Text dim', val: rootStyle.getPropertyValue('--text-dim').trim() },
        { key: '--text-bright', label: 'Text bright', val: rootStyle.getPropertyValue('--text-bright').trim() },
      ];
      for (const c of themeColors) {
        html += `<div class="config-color-row">
          <input type="color" data-css-var="${c.key}" class="cfg-theme-color" value="${c.val}">
          <span class="config-color-label">${c.label}</span>
        </div>`;
      }

      // Per-category colors
      html += `<div class="config-section-label">Category Colors</div>`;
      for (const [cat, color] of Object.entries(CATEGORY_COLORS)) {
        html += `<div class="config-color-row">
          <input type="color" data-cat="${cat}" class="cfg-cat-color" value="${color}">
          <span class="config-color-label">${cat}</span>
        </div>`;
      }

      // Keep the first section label, append the rest
      sectionLabel.insertAdjacentHTML('afterend', html);

      // Font click handlers
      panel.querySelectorAll('.config-font-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const family = opt.dataset.family;
          const name = opt.dataset.font;
          currentFont = name;
          document.documentElement.style.setProperty('--mono', family);
          document.body.style.fontFamily = family;
          panel.querySelectorAll('.config-font-option').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
        });
      });

      // Viz config handlers
      function rerender() { if (DATA) renderProjects(); }

      document.getElementById('cfg-border-color').addEventListener('input', (e) => {
        VIZ_CFG.borderColor = e.target.value;
        document.documentElement.style.setProperty('--green', e.target.value);
        rerender();
      });
      document.getElementById('cfg-fill-opacity').addEventListener('input', (e) => {
        VIZ_CFG.fillOpacity = parseFloat(e.target.value);
        rerender();
      });
      document.getElementById('cfg-border-opacity').addEventListener('input', (e) => {
        VIZ_CFG.borderOpacity = parseFloat(e.target.value);
        rerender();
      });
      document.getElementById('cfg-line-width').addEventListener('input', (e) => {
        VIZ_CFG.lineWidth = parseFloat(e.target.value);
        rerender();
      });
      document.getElementById('cfg-texture-opacity').addEventListener('input', (e) => {
        VIZ_CFG.textureOpacity = parseFloat(e.target.value);
        rerender();
      });
      panel.querySelectorAll('.cfg-cat-color').forEach(input => {
        input.addEventListener('input', (e) => {
          CATEGORY_COLORS[e.target.dataset.cat] = e.target.value;
          rerender();
        });
      });

      // Theme color handlers
      panel.querySelectorAll('.cfg-theme-color').forEach(input => {
        input.addEventListener('input', (e) => {
          const cssVar = e.target.dataset.cssVar;
          document.documentElement.style.setProperty(cssVar, e.target.value);
          // Update JS COLORS object for Three.js
          if (cssVar === '--green') {
            COLORS.green = e.target.value;
            COLORS.greenHex = parseInt(e.target.value.replace('#', ''), 16);
            VIZ_CFG.borderColor = e.target.value;
            const bcInput = document.getElementById('cfg-border-color');
            if (bcInput) bcInput.value = e.target.value;
          } else if (cssVar === '--red') {
            COLORS.red = e.target.value;
            COLORS.redHex = parseInt(e.target.value.replace('#', ''), 16);
          } else if (cssVar === '--bg') {
            COLORS.bg = e.target.value;
            COLORS.bgHex = parseInt(e.target.value.replace('#', ''), 16);
          }
          // Also update dim variants
          if (cssVar === '--green') {
            document.documentElement.style.setProperty('--green-dim', e.target.value + '18');
            document.documentElement.style.setProperty('--green-bright', e.target.value);
          } else if (cssVar === '--red') {
            document.documentElement.style.setProperty('--red-dim', e.target.value + '40');
          }
          rerender();
          // Rebuild terrain if accent or marker color changed
          if (cssVar === '--green' || cssVar === '--red' || cssVar === '--bg') {
            const slider = document.getElementById('terrain-slider-min');
            if (slider && terrainScene) {
              rebuildTerrain(parseInt(slider.value), terrainTotalDays - 1);
            }
          }
        });
      });
    }

    // Toggle
    document.getElementById('config-toggle').addEventListener('click', () => {
      const panel = document.getElementById('config-panel');
      panel.classList.toggle('visible');
    });

    buildConfigPanel();

    // ─── DRAGGABLE DIVIDERS ───
    let activeDrag = null;

    function setupDivider(dividerId, axis, targetId, prop, minVal, maxVal, refId) {
      const div = document.getElementById(dividerId);
      if (!div) return;
      div.addEventListener('mousedown', (e) => {
        activeDrag = { div, axis, targetId, prop, minVal, maxVal, refId };
        div.classList.add('dragging');
        document.body.style.cursor = axis === 'x' ? 'col-resize' : 'row-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });
    }

    document.addEventListener('mousemove', (e) => {
      if (!activeDrag) return;
      const { axis, targetId, prop, minVal, maxVal, refId } = activeDrag;
      const ref = document.getElementById(refId).getBoundingClientRect();
      const target = document.getElementById(targetId);
      if (axis === 'x') {
        const newVal = e.clientX - ref.left;
        const max = typeof maxVal === 'function' ? maxVal() : maxVal;
        if (newVal >= minVal && newVal <= max) target.style[prop] = newVal + 'px';
      } else {
        const newVal = e.clientY - ref.top;
        const max = typeof maxVal === 'function' ? maxVal() : maxVal;
        if (newVal >= minVal && newVal <= max) target.style[prop] = newVal + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      if (!activeDrag) return;
      activeDrag.div.classList.remove('dragging');
      activeDrag = null;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });

    // Left panel ↔ center
    setupDivider('panel-divider', 'x', 'left-panel', 'width', 180, () => document.getElementById('main').getBoundingClientRect().width * 0.5, 'main');

    // Center ↔ right column
    setupDivider('panel-divider-right', 'x', 'right-column', 'width', 200, () => document.getElementById('main').getBoundingClientRect().width * 0.5, 'main');
    // Right divider drags from the right edge, so we need to invert
    const rightDiv = document.getElementById('panel-divider-right');
    if (rightDiv) {
      rightDiv.removeEventListener('mousedown', rightDiv._handler);
      rightDiv.addEventListener('mousedown', (e) => {
        activeDrag = {
          div: rightDiv, axis: 'x-right', targetId: 'right-column', prop: 'width', minVal: 200,
          maxVal: () => document.getElementById('main').getBoundingClientRect().width * 0.5, refId: 'main'
        };
        rightDiv.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });
    }

    // Override mousemove for x-right (drag from right)
    const origMove = document.onmousemove;
    document.addEventListener('mousemove', (e) => {
      if (!activeDrag || activeDrag.axis !== 'x-right') return;
      const ref = document.getElementById('main').getBoundingClientRect();
      const target = document.getElementById('right-column');
      const newWidth = ref.right - e.clientX;
      if (newWidth >= 200 && newWidth <= ref.width * 0.5) {
        target.style.width = newWidth + 'px';
        target.style.flex = 'none';
      }
    });

    // Heatmap ↔ projects (horizontal)
    setupDivider('panel-divider-h', 'y', 'right-bottom', 'height', 100, () => document.getElementById('right-column').getBoundingClientRect().height - 100, 'right-column');

    // ─── TREEMAP HOVER ───
    (function() {
      const canvas = document.getElementById('treemap-canvas');
      const tooltip = document.getElementById('treemap-tooltip');

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const hit = (window._treemapRects || []).find(r =>
          mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h
        );
        if (hit) {
          const p = hit.project;
          const tokens = formatNum(p.rawTokens || 0);
          const d = p.data;
          tooltip.innerHTML = `
            <div class="tt-name">${esc(p.name)}</div>
            <div class="tt-meta">${p.category} · ${d.sessionCount} sessions · ${tokens} tokens</div>
            <div class="tt-meta">${formatDate(d.firstTimestamp)} → ${formatDate(d.lastTimestamp)}</div>
          `;
          tooltip.style.display = 'block';
          tooltip.style.left = (e.clientX + 12) + 'px';
          tooltip.style.top = (e.clientY - 10) + 'px';
        } else {
          tooltip.style.display = 'none';
        }
      });

      canvas.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });
    })();

    new ResizeObserver(() => {
      if (DATA) renderTreemap();
    }).observe(document.getElementById('treemap-container'));


  </script>
</body>
</html>
