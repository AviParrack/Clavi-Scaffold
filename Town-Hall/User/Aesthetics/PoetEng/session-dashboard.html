<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SESSION PULSER — Claude Code Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-panel: #0e0e14;
      --bg-card: #111116;
      --border: #1a1a22;
      --border-bright: #2a2a3a;
      --border-section: color-mix(in srgb, var(--green) 60%, transparent);
      --text: #b8b8b8;
      --text-dim: #5a5a6a;
      --text-bright: #d8d8d8;
      --green: #b4e62e;
      --green-dim: #b4e62e18;
      --green-bright: #c8f040;
      --red: #ff3822;
      --red-dim: #ff382240;
      --cyan: #44aacc;
      --yellow: #ccaa33;
      --section-padding: 26px;
      --mono: 'Fira Code', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 14px;
    }

    /* ─── TOP BAR ─── */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 24px;
      border: none;
      background: var(--bg-panel);
      flex-shrink: 0;
      position: relative;
      font-size: 14px;
      letter-spacing: 0.06em;
    }

    .corner {
      position: absolute;
      width: 13px;
      height: 13px;
      border-color: var(--border-section);
      border-style: solid;
      pointer-events: none;
      z-index: 2;
    }
    .corner.tl { top: 4px; left: 4px; border-width: 1px 0 0 1px; }
    .corner.tr { top: 4px; right: 4px; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: 4px; left: 4px; border-width: 0 0 1px 1px; }
    .corner.br { bottom: 4px; right: 4px; border-width: 0 1px 1px 0; }

    #top-bar-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--green);
      font-family: var(--sans);
    }

    #top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #top-bar-pipe {
      color: var(--border);
      font-size: 16px;
    }

    #global-stats {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #global-stats span {
      color: var(--text-dim);
    }

    #top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 10px;
    }

    .stat-value {
      font-size: 1.077rem;
      font-weight: 700;
      color: var(--text-bright);
    }

    .stat-label {
      font-size: 0.692rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: var(--sans);
    }

    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    .stat-value.cyan { color: var(--cyan); }

    /* ─── MAIN LAYOUT ─── */
    #main {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 6px;
      padding-bottom: 8px;
    }

    /* ─── LEFT PANEL (MAIN) ─── */
    #left-panel {
      flex: none;
      padding: var(--section-padding);
      overflow-y: auto;
      border: none; position: relative;
    }

    #left-panel::-webkit-scrollbar { width: 3px; }
    #left-panel::-webkit-scrollbar-track { background: transparent; }
    #left-panel::-webkit-scrollbar-thumb { background: var(--border-bright); }

    .panel-header {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--green);
      margin-bottom: 10px;
      text-transform: uppercase;
      font-family: var(--sans);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-card {
      display: flex;
      background: var(--bg-card);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
      /* border-left: 1px solid var(--green); */
      border-bottom: 1px solid color-mix(in srgb, var(--green) 40%, transparent); ;
    }

    .session-card:first-child {
      border-top: 1px solid var(--green);
    }

    .session-card:hover {
      background: #16161e;
    }

    .session-card-main {
      flex: 1;
      padding: 8px 12px;
      min-width: 0;
    }

    .session-card-title {
      font-size: 0.654rem;
      font-family: var(--sans);
      font-weight: 400;
      color: var(--green);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-time {
      font-size: 0.588rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      text-transform: none;
      white-space: nowrap;
    }

    .prompt-bracket { display: flex; }
    .bracket-line { width: 8px; flex-shrink: 0; display: flex; flex-direction: column; }
    .bracket-cap-top { width: 8px; height: 6px; flex-shrink: 0; border-left: 1.5px solid var(--text-dim); border-top: 1.5px solid var(--text-dim); border-top-left-radius: 4px; }
    .bracket-cap-bottom { width: 8px; height: 6px; flex-shrink: 0; border-left: 1.5px solid var(--text-dim); border-bottom: 1.5px solid var(--text-dim); border-bottom-left-radius: 4px; }
    .bracket-mid { flex: 1; border-left: 1.5px solid var(--text-dim); }
    .prompt-list { flex: 1; display: flex; flex-direction: column; gap: 2px; padding-left: 6px; min-width: 0; }
    .prompt-first { font-size: 0.72rem; color: var(--text-bright); line-height: 1.45; }
    .prompt-last { font-size: 0.654rem; color: var(--text); line-height: 1.4; }
    .prompt-mid { font-size: 0.654rem; color: var(--text); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prompt-ellipsis { font-size: 0.654rem; color: var(--text-dim); letter-spacing: 0.2em; line-height: 1.2; }
    .prompt-expandable { max-height: 0; overflow: hidden; transition: max-height 0.5s ease, opacity 0.5s ease; opacity: 0; }
    .session-card:hover .prompt-expandable { max-height: 200px; opacity: 1; }

    /* ─── Session badge ─── */
    .session-badge {
      width: 80px;
      flex-shrink: 0;
      /* background: #161620; */
      border-left: 1px dashed var(--green);
      /* border-right: 1px solid var(--green); */
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 6px;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 8px 6px;
      position: relative;
    }

    .session-badge::after {
      content: '';
      position: absolute;
      top: -1px;
      right: -1px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 15px 15px 0;
      border-color: transparent var(--bg) transparent transparent;
      z-index: 2;
    }

    .session-badge::before {
      content: '';
      position: absolute;
      top: -1px;
      right: -1px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 16px 16px 0;
      border-color: transparent var(--green) transparent transparent;
      z-index: 1;
    }

    .badge-row {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dot-grid {
      display: grid;
      grid-template-columns: repeat(3, 6px);
      gap: 2px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 1px;
    }

    .dot.green-on { background: var(--green); }
    .dot.green-off { background: color-mix(in srgb, var(--green) 12%, transparent); }
    .dot.red-on { background: var(--red); }
    .dot.red-off { background: color-mix(in srgb, var(--red) 12%, transparent); }

    .prompt-bars {
      display: flex;
      gap: 1px;
      align-items: flex-end;
      height: 10px;
    }

    .prompt-bar {
      width: 3px;
      border-radius: 0.5px;
    }

    .prompt-bar.on { background: var(--text-dim); }
    .prompt-bar.off { background: #5a5a6a20; }

    /* ─── LEFT PANEL SIZE ─── */
    #left-panel {
      width: 35%;
      max-width: 700px;
      min-width: 300px;
      flex-shrink: 0;
    }

    /* ─── PANEL DIVIDER ─── */
    .panel-divider {
      width: 4px;
      cursor: col-resize;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.15s;
      position: relative;
    }

    .panel-divider::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -4px;
      right: -4px;
    }

    .panel-divider:hover,
    .panel-divider.dragging {
      background: var(--green);
    }

    .panel-divider-h {
      height: 4px;
      cursor: row-resize;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.15s;
      position: relative;
    }

    .panel-divider-h::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -4px;
      bottom: -4px;
    }

    .panel-divider-h:hover,
    .panel-divider-h.dragging {
      background: var(--green);
    }

    /* ─── RIGHT COLUMN ─── */
    #right-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    /* ─── RIGHT TOP: PROJECTS ─── */
    #right-top {
      flex: 1;
      overflow: hidden;
      border: none; position: relative;
      display: flex;
      flex-direction: column;
      padding: var(--section-padding);
      gap: 6px;
      min-height: 0;
    }

    #right-top::-webkit-scrollbar { width: 3px; }
    #right-top::-webkit-scrollbar-track { background: transparent; }
    #right-top::-webkit-scrollbar-thumb { background: var(--border-bright); }

    /* ─── TREEMAP ─── */
    .projects-subheader {
      font-size: 0.615rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 8px 0 4px 0;
    }

    #treemap-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 10px;
      margin-bottom: 4px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.615rem;
      color: var(--text-dim);
    }

    .legend-swatch {
      width: 8px;
      height: 8px;
      border-radius: 1px;
      flex-shrink: 0;
    }

    #projects-content {
      display: flex;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    #projects-left {
      flex: 1;
      min-width: 0;
      display: flex;
    }

    #projects-right {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 6px;
    }

    #projects-right::-webkit-scrollbar { width: 3px; }
    #projects-right::-webkit-scrollbar-track { background: transparent; }
    #projects-right::-webkit-scrollbar-thumb { background: var(--border-bright); }

    #treemap-container {
      width: 100%;
      height: 100%;
      position: relative;
      box-sizing: border-box;
      padding: 12px;
    }

    #treemap-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .treemap-tooltip {
      position: fixed;
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      padding: 6px 10px;
      font-size: 0.692rem;
      color: var(--text-bright);
      pointer-events: none;
      z-index: 100;
      display: none;
      white-space: nowrap;
    }

    .treemap-tooltip .tt-name { font-weight: 600; margin-bottom: 2px; }
    .treemap-tooltip .tt-meta { color: var(--text-dim); }

    /* ─── SPARKLINE LIST ─── */
    #sparkline-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0 12px;
    }

    #sparkline-list::-webkit-scrollbar { width: 3px; }
    #sparkline-list::-webkit-scrollbar-track { background: transparent; }
    #sparkline-list::-webkit-scrollbar-thumb { background: var(--border-bright); }

    .spark-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
      border: 1px solid var(--border);
    }

    .spark-row.dormant { opacity: 0.45; }

    .spark-name {
      font-size: 0.692rem;
      color: var(--text-bright);
      flex-shrink: 0;
      width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spark-chart {
      flex: 1;
      height: 11px;
      margin-left: 6px;
    }

    /* ─── RIGHT BOTTOM: ACTIVITY GRID ─── */
    #right-bottom {
      flex: none;
      height: 280px;
      padding: var(--section-padding);
      overflow: hidden;
      border: none; position: relative;
    }

    .grid-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }

    .grid-btn {
      font-family: var(--mono);
      font-size: 0.692rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 8px;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .grid-btn:hover { border-color: var(--text-dim); }
    .grid-btn.active { border-color: var(--green); color: var(--green); }

    .range-btn {
      font-family: var(--mono);
      font-size: 0.692rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 8px;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .range-btn:hover { border-color: var(--text-dim); }
    .range-btn.active { border-color: var(--green); color: var(--green); }

    .grid-filter {
      font-family: var(--mono);
      font-size: 0.692rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--text);
      padding: 3px 6px;
      margin-left: auto;
      cursor: pointer;
    }

    #activity-grid {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      align-content: flex-start;
      flex: 1;
      min-height: 0;
    }

    /* Default: small dot for empty cells */
    .grid-cell {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #1a1a26;
      margin: 2.5px;
    }

    /* Active cells: larger squares */
    .grid-cell[data-level="1"],
    .grid-cell[data-level="2"],
    .grid-cell[data-level="3"],
    .grid-cell[data-level="4"] {
      width: 8px;
      height: 8px;
      border-radius: 1px;
      margin: 0;
    }

    /* Grid mode: when JS sets grid display */
    #activity-grid.grid-mode {
      display: grid;
      gap: 2px;
      align-content: center;
    }

    #activity-grid.grid-mode .grid-cell {
      width: 8px;
      height: 8px;
      margin: 0;
      border-radius: 1px;
      justify-self: center;
    }

    #activity-grid.grid-mode .grid-cell[data-level="0"] {
      width: 3px;
      height: 3px;
      border-radius: 50%;
    }

    .grid-cell:hover {
      outline: 1px solid var(--green);
      outline-offset: 1px;
    }

    .grid-cell[data-level="1"] { background: color-mix(in srgb, var(--green) 19%, transparent); }
    .grid-cell[data-level="2"] { background: color-mix(in srgb, var(--green) 38%, transparent); }
    .grid-cell[data-level="3"] { background: color-mix(in srgb, var(--green) 60%, transparent); }
    .grid-cell[data-level="4"] { background: color-mix(in srgb, var(--green) 87%, transparent); }

    .grid-months {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 0.615rem;
      color: var(--text-dim);
    }

    .grid-tooltip {
      position: fixed;
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      padding: 4px 8px;
      font-size: 0.692rem;
      color: var(--text);
      pointer-events: none;
      z-index: 100;
      display: none;
    }

    /* ─── LEFT PANEL TRANSITIONS ─── */
    #left-panel {
      transition: width 0.3s ease;
    }

    #left-panel.collapsed {
      width: 220px;
      flex: none;
    }

    #left-panel.collapsed .prompt-bracket,
    #left-panel.collapsed .session-badge {
      display: none;
    }

    #left-panel.collapsed .prompt-first {
      font-size: 0.692rem;
    }

    #left-panel.collapsed .session-card-main {
      padding: 5px 8px;
    }

    #left-panel.collapsed .session-card-title {
      margin-bottom: 3px;
    }

    .session-card.active {
      background: #1a1e14;
    }

    /* ─── TERMINAL PANEL ─── */
    #terminal-panel {
      flex: none;
      width: 50%;
      display: none;
      flex-direction: column;
      min-width: 300px;
      border: none; position: relative;
      background: #0c0c10;
    }

    #terminal-panel.open {
      display: flex;
    }

    #terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      flex-shrink: 0;
    }

    #terminal-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #terminal-title {
      font-size: 0.769rem;
      font-weight: 600;
      font-family: var(--sans);
      color: var(--green);
      letter-spacing: 0.1em;
    }

    #terminal-session-name {
      font-size: 0.692rem;
      color: var(--text-dim);
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .terminal-status {
      font-size: 0.615rem;
      padding: 2px 6px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .terminal-status.connected {
      color: var(--green);
      border: 1px solid var(--green-dim);
    }

    .terminal-status.disconnected {
      color: var(--red);
      border: 1px solid var(--red);
    }

    #terminal-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-btn {
      font-family: var(--mono);
      font-size: 0.615rem;
      padding: 2px 8px;
      background: none;
      border: 1px solid var(--border-bright);
      color: var(--text-dim);
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.15s;
    }

    .terminal-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }

    .terminal-btn.close-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    #terminal-container {
      flex: 1;
      padding: 4px;
      min-height: 0;
    }

    .xterm-viewport { background-color: #0c0c10 !important; }

    .mode-tabs {
      display: flex;
      gap: 2px;
    }

    .mode-tab {
      font-family: var(--mono);
      font-size: 0.615rem;
      padding: 2px 8px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.15s;
    }

    .mode-tab.active {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-dim);
    }

    .mode-tab:hover:not(.active) {
      border-color: var(--border-bright);
      color: var(--text);
    }

    /* ─── CENTER COLUMN ─── */
    #center-column {
      flex: 2;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    #center-column.hidden {
      display: none;
    }

    /* ─── RIGHT COLUMN TRANSITIONS ─── */
    #right-column {
      transition: width 0.3s ease;
    }

    #right-column.compressed {
      flex: 1;
      min-width: 250px;
      overflow-y: auto;
    }

    /* ─── TERRAIN PANEL ─── */
    #terrain-panel {
      flex: 1;
      min-height: 200px;
      min-width: 0;
      position: relative;
      border: none;
      background: var(--bg);
      padding: var(--section-padding);
      overflow: hidden;
    }

    #terrain-panel.hidden {
      display: none;
    }

    #terrain-panel.in-sidebar {
      flex: none;
      height: 30%;
      min-height: 120px;
    }

    #terrain-scrubber {
      position: absolute;
      bottom: var(--section-padding);
      left: var(--section-padding);
      right: var(--section-padding);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 5;
      background: #0a0a0fcc;
      padding: 6px 10px;
      border: 1px solid var(--border);
    }

    .terrain-date {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-dim);
      white-space: nowrap;
      letter-spacing: 0.05em;
      min-width: 42px;
    }

    #terrain-slider-min,
    #terrain-slider-max {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      background: var(--border);
      outline: none;

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

  <script type="module">
    import { Terminal } from '/node_modules/@xterm/xterm/lib/xterm.mjs';
    import { FitAddon } from '/node_modules/@xterm/addon-fit/lib/addon-fit.mjs';
    import { WebLinksAddon } from '/node_modules/@xterm/addon-web-links/lib/addon-web-links.mjs';
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ─── Read CSS variables for use in JS/Three.js ───
    const rootStyle = getComputedStyle(document.documentElement);
    const COLORS = {
      green: rootStyle.getPropertyValue('--green').trim(),
      greenHex: parseInt(rootStyle.getPropertyValue('--green').trim().replace('#', ''), 16),
      red: rootStyle.getPropertyValue('--red').trim(),
      redHex: parseInt(rootStyle.getPropertyValue('--red').trim().replace('#', ''), 16),
      cyan: rootStyle.getPropertyValue('--cyan').trim(),
      bg: rootStyle.getPropertyValue('--bg').trim(),
      bgHex: parseInt(rootStyle.getPropertyValue('--bg').trim().replace('#', ''), 16),
    };

    let DATA = null;
    let sessionSearch = '';
    let sessionSort = 'recent';
    let sessionProjectFilter = 'all';
    let gridMetric = 'tokens';

    const CATEGORY_COLORS = {
      'Creative Coding':      '#ff2a6d',
      'Visual Art & Shaders': '#d946ef',
      'Data & Visualization': '#05d9e8',
      'Machine Learning':     '#ff6e27',
      'Apps & Tools':         '#01c8ee',
      'Research':             '#f5e642',
      'AI & Dev Tools':       '#7b61ff',
      'Misc':                 '#4a5568',
    };

    let sparkFill = false;

    // Configurable viz parameters
    const VIZ_CFG = {
      borderColor: COLORS.green,
      fillOpacity: 0,
      borderOpacity: 0.7,
      lineWidth: 0.8,
      textureOpacity: 0.7,
    };

    // ─── ORBIT ANIMATION (post-click) ───
    function playOrbitAnim() {
      return new Promise(resolve => {
        const canvas = document.getElementById('orbit-canvas');
        canvas.style.display = 'block';
        canvas.style.width = '320px';
        canvas.style.height = '180px';

        const greenHex = COLORS.greenHex;
        const scene = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(40, 320 / 180, 0.1, 100);
        cam.position.set(0, 4, 8);
        cam.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(320, 180);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);

        // Orbit rings
        const orbitData = [
          { radius: 1, speed: 2.5, phase: 0 },
          { radius: 1.8, speed: 1.5, phase: 1.5 },
          { radius: 2.8, speed: 0.8, phase: 3 },
        ];

        const orbitGroup = new THREE.Group();

        // Ring lines (tilted ellipses)
        for (const orb of orbitData) {
          const curve = new THREE.EllipseCurve(0, 0, orb.radius, orb.radius, 0, Math.PI * 2, false, 0);
          const pts = curve.getPoints(64);
          const geo = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, 0, p.y)));
          const mat = new THREE.LineBasicMaterial({ color: greenHex, transparent: true, opacity: 0.3 });
          orbitGroup.add(new THREE.LineLoop(geo, mat));
        }

        // Center sphere
        const centerGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const centerMat = new THREE.MeshBasicMaterial({ color: greenHex });
        orbitGroup.add(new THREE.Mesh(centerGeo, centerMat));

        // Orbiting dots
        const dots = [];
        for (const orb of orbitData) {
          const dotGeo = new THREE.SphereGeometry(0.06, 8, 8);
          const dotMat = new THREE.MeshBasicMaterial({ color: greenHex });
          const dot = new THREE.Mesh(dotGeo, dotMat);
          orbitGroup.add(dot);
          dots.push({ mesh: dot, ...orb });
        }

        // Crosshair lines
        const chMat = new THREE.LineBasicMaterial({ color: greenHex, transparent: true, opacity: 0.1 });
        const chGeo1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4, 0, 0), new THREE.Vector3(4, 0, 0)]);
        const chGeo2 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -4), new THREE.Vector3(0, 0, 4)]);
        orbitGroup.add(new THREE.Line(chGeo1, chMat));
        orbitGroup.add(new THREE.Line(chGeo2, chMat));

        // Tilt the whole system
        orbitGroup.rotation.x = 0.5;
        scene.add(orbitGroup);

        // Point light glow
        const light = new THREE.PointLight(greenHex, 1, 8);
        light.position.set(0, 1, 0);
        scene.add(light);

        const duration = 1.2;
        const start = performance.now();

        function animate() {
          const elapsed = (performance.now() - start) / 1000;
          if (elapsed > duration) {
            renderer.dispose();
            resolve();
            return;
          }

          const t = elapsed / duration;
          const fadeIn = Math.min(t * 5, 1);
          const fadeOut = t > 0.65 ? 1 - (t - 0.65) / 0.35 : 1;
          const alpha = fadeIn * fadeOut;

          // Rotate slowly
          orbitGroup.rotation.y = elapsed * 0.8;

          // Update dot positions
          for (const d of dots) {
            const a = elapsed * d.speed + d.phase;
            d.mesh.position.set(Math.cos(a) * d.radius, 0, Math.sin(a) * d.radius);
          }

          // Fade everything
          orbitGroup.children.forEach(ch => {
            if (ch.material) {
              if (ch.material.opacity !== undefined && ch.material.transparent) {
                ch.material.opacity = (ch.material === chMat ? 0.1 : ch.material === centerMat ? 1 : 0.3) * alpha;
              }
            }
          });
          centerMat.opacity = alpha;
          centerMat.transparent = true;
          light.intensity = alpha;

          renderer.render(scene, cam);
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      });
    }
    // ─── LOAD ───
    document.getElementById('load-btn').addEventListener('click', async () => {
      // Hide button, start animation + data fetch in parallel
      document.getElementById('load-btn').style.display = 'none';
      const [_, resp] = await Promise.all([
        playOrbitAnim(),
        fetch('sessions-data.json'),
      ]);
      if (!resp.ok) {
        const errEl = document.getElementById('load-content') || document.getElementById('load-screen');
        errEl.innerHTML = `
          <div style="color:var(--red);font-size:12px;letter-spacing:0.05em;text-align:center;max-width:400px;">
            <div style="font-size:14px;margin-bottom:8px;font-family:var(--sans);">DATA NOT FOUND</div>

    function formatNum(n) {

      return `${months[d.getMonth()]} ${d.getDate()}, ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;

      if (mins < 60) return `${mins}m ago`;

      const months = Math.floor(days / 30);

      const pl=new THREE.PointLight(COLORS.greenHex,0.3,30);pl.position.set(0,10,0);terrainScene.add(pl);

      // Scrubber setup — single slider for start date, end is always now
      const sliderMin = document.getElementById('terrain-slider-min');
      const dateMinEl = document.getElementById('terrain-date-min');
      const dateMaxEl = document.getElementById('terrain-date-max');
      sliderMin.max = terrainTotalDays - 1;
      sliderMin.value = 0;

      function fmtDate(dayOffset) {
        const d = new Date(terrainEarliest + dayOffset * 86400000);
        return `${d.getMonth()+1}/${d.getDate()}`;
      }
      dateMinEl.textContent = fmtDate(0);
      dateMaxEl.textContent = fmtDate(terrainTotalDays - 1);

      sliderMin.addEventListener('input', () => {
        const lo = parseInt(sliderMin.value);
        dateMinEl.textContent = fmtDate(lo);
        rebuildTerrain(lo, terrainTotalDays - 1);
      });

      // Initial build
      rebuildTerrain(0, terrainTotalDays - 1);

      // Animate
      function animate() {
        terrainAnimId = requestAnimationFrame(animate);
        terrainControls.update();
        if (markerGroupObj) markerGroupObj.children.forEach(ch => { if (ch.geometry?.type === 'RingGeometry') ch.rotation.z = performance.now() * 0.0005; });
        terrainRenderer.render(terrainScene, terrainCamera);
        const r = container.getBoundingClientRect();
        for (const { el, pos } of labelElsArr) {
          const p = pos.clone().project(terrainCamera);
          if (p.z > 1) { el.style.display = 'none'; continue; }
          el.style.display = '';
          el.style.left = ((p.x + 1) / 2 * r.width) + 'px';
          el.style.top = ((-p.y + 1) / 2 * r.height) + 'px';
        }
      }
      animate();

      // Resize
      const tro = new ResizeObserver(() => {
        const r = container.getBoundingClientRect();
        if (r.width === 0 || r.height === 0) return;
        const a = r.width / r.height;
        terrainCamera.left = -frustumSize * a / 2; terrainCamera.right = frustumSize * a / 2;
        terrainCamera.top = frustumSize / 2; terrainCamera.bottom = -frustumSize / 2;
        terrainCamera.updateProjectionMatrix();
        terrainRenderer.setSize(r.width, r.height);
      });
      tro.observe(container);
    }
    // ─── BADGE HELPERS ───
    function dotGrid(value, max, onClass, offClass, label) {
      const level = Math.round((value / max) * 9);
      let html = `<div class="dot-grid" title="${label}: ${formatNum(value)}">`;
      for (let i = 0; i < 9; i++) {
        html += `<div class="dot ${i < level ? onClass : offClass}"></div>`;
      }
      html += '</div>';
      return html;
    }

    function promptBars(value, max) {
      const totalBars = 12;
      const lit = Math.round((value / max) * totalBars);
      let html = `<div class="prompt-bars" title="${value} prompts">`;
      for (let i = 0; i < totalBars; i++) {
        const h = 4 + Math.round((i / totalBars) * 6);
        html += `<div class="prompt-bar ${i < lit ? 'on' : 'off'}" style="height:${h}px"></div>`;
      }
      html += '</div>';
      return html;
    }

    // ─── SESSIONS ───
    function renderSessions() {
      // Populate project filter dropdown
      const filterOpts = document.getElementById('session-project-filter-options');
      if (filterOpts && filterOpts.children.length <= 1) {
        const projects = [...new Set(DATA.notes.map(n => n.subfolder))].sort();
        filterOpts.innerHTML = '<div class="custom-select-option active" data-value="all">ALL PROJECTS</div>' +
          projects.map(p => `<div class="custom-select-option" data-value="${esc(p)}">${esc(p)}</div>`).join('');
      }

      let notes = [...DATA.notes]
        .filter(n => n.promptCount > 1 || n.charsAdded > 0 || n.charsRemoved > 0 || n.filesTouched > 0)
        .filter(n => sessionProjectFilter === 'all' || n.subfolder === sessionProjectFilter);

      // Search filter
      if (sessionSearch) {
        const terms = sessionSearch.toLowerCase().split(/\s+/);
        notes = notes.filter(n => {
          const text = `${n.name} ${n.lastPrompt || ''} ${n.text_preview || ''} ${n.subfolder}`.toLowerCase();
          return terms.every(t => text.includes(t));
        });
      }

      // Sort
      if (sessionSort === 'recent') {
        notes.sort((a, b) => b.lastTimestamp - a.lastTimestamp);
      } else if (sessionSort === 'oldest') {
        notes.sort((a, b) => a.lastTimestamp - b.lastTimestamp);
      } else if (sessionSort === 'project') {
        notes.sort((a, b) => a.subfolder.localeCompare(b.subfolder) || b.lastTimestamp - a.lastTimestamp);
      } else if (sessionSort === 'changes') {
        notes.sort((a, b) => (b.charsAdded + b.charsRemoved) - (a.charsAdded + a.charsRemoved));
      }

      document.getElementById('session-count-label').textContent = notes.length + ' total';

      const el = document.getElementById('session-list');
      // Compute max values for badge normalization
      const allNotes = DATA.notes;
      const maxAdded = Math.max(1, ...allNotes.map(n => n.charsAdded || 0));
      const maxRemoved = Math.max(1, ...allNotes.map(n => n.charsRemoved || 0));
      const maxPrompts = Math.max(1, ...allNotes.map(n => n.promptCount || 0));

      el.innerHTML = notes.map(n => {
        const samples = n.promptSamples || [n.name];
        const first = samples[0] || n.name;
        const last = samples.length > 1 ? samples[samples.length - 1] : null;
        const hasLast = last && last !== first;

        // Build middle prompts for hover expansion
        let midHtml = '';
        if (samples.length > 2) {
          let midPrompts = [];
          let hasEllipsis = false;
          if (samples.length <= 6) {
            midPrompts = samples.slice(1, -1);
          } else {
            midPrompts = samples.slice(1, 3);
            hasEllipsis = n.promptCount > 6;
            midPrompts.push(null);
            midPrompts = midPrompts.concat(samples.slice(3, -1));
          }
          midHtml = '<div class="prompt-expandable">';
          for (const p of midPrompts) {
            midHtml += p === null
              ? '<div class="prompt-ellipsis">...</div>'
              : `<div class="prompt-mid">${esc(p)}</div>`;
          }
          midHtml += '</div>';
        }

        // Bracket prompt block
        let promptBlock;
        if (hasLast) {
          promptBlock = `
            <div class="prompt-bracket">
              <div class="bracket-line">
                <div class="bracket-cap-top"></div>
                <div class="bracket-mid"></div>
                <div class="bracket-cap-bottom"></div>
              </div>
              <div class="prompt-list">
                <div class="prompt-first">${esc(first)}</div>
                <div class="prompt-ellipsis">...</div>
                ${midHtml}
                <div class="prompt-last">${esc(last)}</div>
              </div>
            </div>`;
        } else {
          promptBlock = `<div class="prompt-first">${esc(first)}</div>`;

        return `
          <div class="session-card" data-session-id="${esc(n.sessionId)}">
            <div class="session-card-main">
              <div class="session-card-title">

    // ─── TREEMAP ───
    function squarify(items, rect) {
      // Returns array of { item, x, y, w, h } for each item
      // items = [{ name, value, ... }] sorted by value descending
      // rect = { x, y, w, h }
      if (!items.length) return [];
      const total = items.reduce((s, it) => s + it.value, 0);
      if (total === 0) return [];

      const rects = [];
      let remaining = [...items];
      let r = { ...rect };

      while (remaining.length > 0) {
        const isWide = r.w >= r.h;
        const side = isWide ? r.h : r.w;
        const remTotal = remaining.reduce((s, it) => s + it.value, 0);

        // Find the best row
        let row = [remaining[0]];
        let rowVal = remaining[0].value;

        function worstRatio(rowItems, rowSum) {
          const area = (rowSum / remTotal) * r.w * r.h;
          const rowSide = area / side;
          let worst = 0;
          for (const it of rowItems) {
            const itArea = (it.value / remTotal) * r.w * r.h;
            const itSide = itArea / rowSide;
            const ratio = Math.max(rowSide / itSide, itSide / rowSide);
            if (ratio > worst) worst = ratio;
          }
          return worst;
        }

        for (let i = 1; i < remaining.length; i++) {
          const next = remaining[i];
          const newRow = [...row, next];
          const newVal = rowVal + next.value;
          if (worstRatio(newRow, newVal) <= worstRatio(row, rowVal)) {
            row = newRow;
            rowVal = newVal;
          } else {
            break;
          }
        }

        // Lay out the row
        const rowFrac = rowVal / remTotal;
        const rowThickness = isWide ? r.w * rowFrac : r.h * rowFrac;
        let offset = 0;

        for (const it of row) {
          const itFrac = it.value / rowVal;
          const itLen = side * itFrac;
          if (isWide) {
            rects.push({ item: it, x: r.x, y: r.y + offset, w: rowThickness, h: itLen });
          } else {
            rects.push({ item: it, x: r.x + offset, y: r.y, w: itLen, h: rowThickness });
          }
          offset += itLen;
        }

        // Shrink remaining rect
        if (isWide) {
          r = { x: r.x + rowThickness, y: r.y, w: r.w - rowThickness, h: r.h };
        } else {
          r = { x: r.x, y: r.y + rowThickness, w: r.w, h: r.h - rowThickness };
        }

        remaining = remaining.slice(row.length);
      }

      return rects;
    }

    // ─── TEXTURE PATTERNS ───
    const CATEGORY_TEXTURES = {};
    function buildTextures(ctx) {
      const color = VIZ_CFG.borderColor;
      const texAlpha = VIZ_CFG.textureOpacity;
      const cats = Object.keys(CATEGORY_COLORS);
      const drawFns = [
        // Diagonal lines ////
        (c, s) => { c.beginPath(); c.moveTo(0, s); c.lineTo(s, 0); c.moveTo(-1, 1); c.lineTo(1, -1); c.moveTo(s-1, s+1); c.lineTo(s+1, s-1); c.stroke(); },
        // Cross-hatch XXXX
        (c, s) => { c.beginPath(); c.moveTo(0, s); c.lineTo(s, 0); c.moveTo(0, 0); c.lineTo(s, s); c.stroke(); },
        // Dots
        (c, s) => { c.beginPath(); c.arc(s/2, s/2, 0.5, 0, Math.PI*2); c.fill(); },
        // Horizontal lines
        (c, s) => { c.beginPath(); c.moveTo(0, s/2); c.lineTo(s, s/2); c.stroke(); },
        // Vertical lines
        (c, s) => { c.beginPath(); c.moveTo(s/2, 0); c.lineTo(s/2, s); c.stroke(); },
        // Dashes
        (c, s) => { c.beginPath(); c.moveTo(0.5, s/2); c.lineTo(s-0.5, s/2); c.stroke(); },
        // Grid
        (c, s) => { c.beginPath(); c.moveTo(s/2, 0); c.lineTo(s/2, s); c.moveTo(0, s/2); c.lineTo(s, s/2); c.stroke(); },
        // Back-diagonal \\\\
        (c, s) => { c.beginPath(); c.moveTo(0, 0); c.lineTo(s, s); c.moveTo(-1, s-1); c.lineTo(1, s+1); c.moveTo(s-1, -1); c.lineTo(s+1, 1); c.stroke(); },
      ];

      cats.forEach((cat, i) => {
        const size = 4;
        const off = document.createElement('canvas');
        off.width = size;
        off.height = size;
        const oc = off.getContext('2d');
        oc.clearRect(0, 0, size, size);
        oc.strokeStyle = color;
        oc.fillStyle = color;
        oc.globalAlpha = texAlpha;
        oc.lineWidth = 0.5;
        drawFns[i % drawFns.length](oc, size);
        CATEGORY_TEXTURES[cat] = ctx.createPattern(off, 'repeat');
      });
    }

    function renderTreemap() {
      const canvas = document.getElementById('treemap-canvas');
      const dpr = window.devicePixelRatio || 1;
      const W = canvas.clientWidth;
      const H = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      buildTextures(ctx);

      const projects = DATA.groupsByProject;

      // Group by category, sum tokens
      const catTotals = {};
      for (const p of projects) {
        const cat = p.category || 'Misc';
        if (!catTotals[cat]) catTotals[cat] = { name: cat, value: 0, projects: [] };
        const tokens = (p.totalInputTokens || 0) + (p.totalOutputTokens || 0);
        catTotals[cat].value += tokens;
        catTotals[cat].projects.push({ name: p.name, value: tokens, rawTokens: tokens, category: cat, data: p });
      }

      // Render legend with texture swatches
      const legendEl = document.getElementById('treemap-legend');
      legendEl.innerHTML = '';
      Object.entries(CATEGORY_COLORS)
        .filter(([cat]) => catTotals[cat] && catTotals[cat].value > 0)
        .forEach(([cat]) => {
          const item = document.createElement('div');
          item.className = 'legend-item';
          const swatch = document.createElement('canvas');
          swatch.width = 28; swatch.height = 28;
          swatch.style.width = '14px';
          swatch.style.height = '14px';
          swatch.style.flexShrink = '0';
          const sc = swatch.getContext('2d');
          sc.scale(2, 2);
          const pat = CATEGORY_TEXTURES[cat];
          if (pat) { sc.fillStyle = pat; sc.fillRect(0, 0, 14, 14); }
          sc.strokeStyle = VIZ_CFG.borderColor;
          sc.globalAlpha = VIZ_CFG.borderOpacity;
          sc.lineWidth = 1;
          sc.strokeRect(0.5, 0.5, 13, 13);
          item.appendChild(swatch);
          item.appendChild(document.createTextNode(cat));
          legendEl.appendChild(item);
        });

      const categories = Object.values(catTotals)
        .filter(c => c.value > 0)
        .sort((a, b) => b.value - a.value);

      // Layout categories
      const GAP = 2;
      const catRects = squarify(categories, { x: 0, y: 0, w: W, h: H });

      // Store all project rects for hover detection
      window._treemapRects = [];

      for (const cr of catRects) {
        const color = CATEGORY_COLORS[cr.item.name] || CATEGORY_COLORS['Misc'];

        // Sort projects within category
        const projs = cr.item.projects.sort((a, b) => b.value - a.value);

        // Inset for category grouping
        const inset = 1;
        const projRects = squarify(projs, {
          x: cr.x + inset, y: cr.y + inset,
          w: cr.w - inset * 2, h: cr.h - inset * 2
        });

        for (const pr of projRects) {
          const cx = pr.x + GAP/2, cy = pr.y + GAP/2, cw = pr.w - GAP, ch = pr.h - GAP;

          // Draw color fill
          ctx.fillStyle = color;
          ctx.globalAlpha = VIZ_CFG.fillOpacity;
          ctx.fillRect(cx, cy, cw, ch);

          // Draw texture pattern
          const pattern = CATEGORY_TEXTURES[cr.item.name];
          if (pattern) {
            ctx.fillStyle = pattern;
            ctx.globalAlpha = 1;
            ctx.fillRect(cx, cy, cw, ch);
          }

          // Draw border
          ctx.globalAlpha = VIZ_CFG.borderOpacity;
          ctx.strokeStyle = VIZ_CFG.borderColor;
          ctx.lineWidth = VIZ_CFG.lineWidth;
          ctx.strokeRect(cx, cy, cw, ch);
          ctx.globalAlpha = 1;

          // Label if cell is large enough (40x20 minimum)
          if (pr.w - GAP > 40 && pr.h - GAP > 20) {
            ctx.fillStyle = '#e8e8e8';
            ctx.font = `${Math.min(11, Math.max(8, pr.h / 3))}px 'IBM Plex Mono'`;
            ctx.textBaseline = 'middle';
            const maxTextW = pr.w - GAP - 6;
            let label = pr.item.name;
            // Truncate if needed
            while (ctx.measureText(label).width > maxTextW && label.length > 3) {
              label = label.slice(0, -2) + '\u2026';
            }
            if (ctx.measureText(label).width <= maxTextW) {
              ctx.fillText(label, pr.x + GAP/2 + 3, pr.y + pr.h / 2);
            }
          }

          // Store for hover
          window._treemapRects.push({
            x: pr.x + GAP/2, y: pr.y + GAP/2,
            w: pr.w - GAP, h: pr.h - GAP,
            project: pr.item
          });
        }
      }
    }

    function renderSparklines() {
      const projects = [...DATA.groupsByProject]
        .sort((a, b) => b.lastTimestamp - a.lastTimestamp);

      // Find global time range (first session ever → now)
      const allTimestamps = DATA.notes.map(n => n.firstTimestamp).filter(Boolean);
      const globalStart = Math.min(...allTimestamps);
      const globalEnd = Date.now();
      const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
      const numBuckets = Math.ceil((globalEnd - globalStart) / WEEK_MS) + 1;

      // Build note lookup by ID for quick access
      const noteById = {};
      for (const n of DATA.notes) noteById[n.id] = n;

      // 14 days dormancy threshold
      const DORMANT_MS = 14 * 24 * 60 * 60 * 1000;

      const el = document.getElementById('sparkline-list');
      el.innerHTML = projects.map(p => {
        // Bucket tokens by week
        const buckets = new Array(numBuckets).fill(0);
        for (const noteId of p.noteIds) {
          const note = noteById[noteId];
          if (!note) continue;
          const idx = Math.floor((note.firstTimestamp - globalStart) / WEEK_MS);
          buckets[Math.min(idx, numBuckets - 1)] += (note.inputTokens || 0) + (note.outputTokens || 0);
        }

        const maxVal = Math.max(...buckets, 1);
        const isDormant = (globalEnd - p.lastTimestamp) > DORMANT_MS;

        // Build SVG sparkline

        const svgH = 20;
