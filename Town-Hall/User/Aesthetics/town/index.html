<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Town · Sprout</title>
<style>
  :root {
    --bg: #16140f;
    --ink: #f0e8d8;
    --dim: rgba(240,232,216,0.55);
    --accent: #E87040;
    --accent-soft: #F5A47D;
    --panel: rgba(18,14,10,0.92);
    --border: rgba(232,112,64,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden; cursor: default; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; cursor: default; }

  #hud { position: fixed; top: 16px; left: 16px; pointer-events: none; display: flex; flex-direction: column; gap: 4px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  #hud .title { font-size: 16px; color: var(--accent); font-weight: 600; letter-spacing: 0.1em; }
  #hud .dim { color: var(--dim); }
  #hud kbd { font-family: 'Fira Code', monospace; background: rgba(232,112,64,0.15); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; font-size: 10px; color: var(--accent-soft); }
  #hud .ln { display: flex; gap: 8px; align-items: center; }

  #corner { position: fixed; top: 16px; right: 16px; font-size: 11px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; text-align: right; }
  #corner .asset { color: var(--accent); }
  #corner .cred { color: rgba(240,232,216,0.35); font-size: 9px; margin-top: 6px; letter-spacing: 0.04em; }
  #corner .cred a { color: rgba(240,232,216,0.5); text-decoration: none; }
  #corner .cred a:hover { color: var(--accent); }

  #toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); padding: 10px 18px; font-size: 14px; letter-spacing: 0.06em; opacity: 0; transition: opacity 160ms ease; pointer-events: none; color: var(--ink); }
  #toast.show { opacity: 1; }
  #toast b { color: var(--accent); }

  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--border); padding: 6px 10px; font-size: 11px; letter-spacing: 0.04em; color: var(--ink); opacity: 0; transition: opacity 100ms; }
  #tip.show { opacity: 1; }
  #tip b { color: var(--accent); }

  #prompt { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); padding: 8px 14px; font-size: 13px; letter-spacing: 0.06em; color: var(--ink); opacity: 0; transition: opacity 120ms; pointer-events: none; }
  #prompt.show { opacity: 1; }
  #prompt kbd { font-family: 'Fira Code', monospace; background: rgba(232,112,64,0.22); border: 1px solid var(--border); padding: 1px 6px; border-radius: 3px; font-size: 11px; color: var(--accent-soft); margin: 0 2px; }

  /* Chat panel — right-side drawer for talking to Claudes */
  #chat { position: fixed; top: 16px; right: 16px; width: 400px; max-height: calc(100vh - 32px); background: var(--panel); border: 1px solid var(--border); display: none; flex-direction: column; backdrop-filter: blur(10px); overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(232,112,64,0.15); }
  #chat.open { display: flex; }
  #chat .head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: rgba(232,112,64,0.08); }
  #chat .avatar { width: 40px; height: 40px; border-radius: 6px; background: rgba(232,112,64,0.14); border: 1px solid var(--border); display: grid; place-items: center; overflow: hidden; }
  #chat .avatar canvas { width: 100%; height: 100%; image-rendering: pixelated; }
  #chat .who { flex: 1; }
  #chat .who .n { font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  #chat .who .r { font-size: 10px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
  #chat .close { color: var(--dim); cursor: pointer; font-family: 'Fira Code', monospace; font-size: 13px; padding: 4px 8px; }
  #chat .close:hover { color: var(--accent); }
  #chat .iconBtn { background: rgba(232,112,64,0.08); border: 1px solid var(--border); color: var(--dim); cursor: pointer; font-family: 'Fira Code', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; transition: all 120ms ease; }
  #chat .iconBtn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); background: rgba(232,112,64,0.18); }
  #chat .iconBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #chat .log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.55; min-height: 180px; max-height: calc(100vh - 220px); }
  #chat .msg { padding: 9px 12px; border-radius: 8px; max-width: 88%; word-wrap: break-word; white-space: pre-wrap; animation: fadeIn 200ms ease; }
  #chat .msg.user { align-self: flex-end; background: rgba(232,112,64,0.18); border: 1px solid var(--border); color: var(--ink); }
  #chat .msg.npc  { align-self: flex-start; background: rgba(240,232,216,0.05); border: 1px solid rgba(240,232,216,0.12); color: var(--ink); }
  #chat .msg.sys  { align-self: center; color: var(--dim); font-size: 11px; font-style: italic; border: none; background: transparent; padding: 2px; }
  #chat .msg .who { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; }
  #chat .msg.thinking { color: var(--accent-soft); font-style: italic; }
  #chat .msg.thinking::after { content: '…'; display: inline-block; animation: blink 1s infinite; }
  #chat form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.25); }
  #chat input[type=text] { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--ink); font-family: inherit; font-size: 13px; padding: 8px 10px; outline: none; border-radius: 4px; }
  #chat input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,112,64,0.15); }
  #chat button { background: var(--accent); color: #1a0e08; border: none; font-family: inherit; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 0 14px; cursor: pointer; border-radius: 4px; }
  #chat button:hover { background: var(--accent-soft); }
  #chat button:disabled { background: rgba(232,112,64,0.3); cursor: not-allowed; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="hud">
  <div class="title">Claude Town · Sprout Isle</div>
  <div class="ln dim"><kbd>WASD</kbd> move · <kbd>click</kbd> to walk · <kbd>E</kbd> or click on a Claude to talk</div>
  <div class="ln dim"><kbd>Shift</kbd> run · <kbd>Esc</kbd> close chat</div>
</div>

<div id="corner">
  <div>top-down · sprout</div>
  <div class="asset" id="assetStatus">loading…</div>
  <div class="cred">art — <a href="https://cupnooble.itch.io/sprout-lands-asset-pack" target="_blank">sprout lands · cup nooble</a></div>
</div>

<div id="toast"></div>
<div id="tip"></div>
<div id="prompt"><kbd>E</kbd> <span id="promptText">talk</span></div>

<div id="chat">
  <div class="head">
    <div class="avatar" id="chatAvatar"></div>
    <div class="who">
      <div class="n" id="chatName">—</div>
      <div class="r" id="chatRole"></div>
    </div>
    <button class="iconBtn" id="chatTerm" title="Continue this conversation in a real Claude Code terminal (forks the session so this chat keeps its thread)">⌨ terminal</button>
    <span class="close" id="chatClose">✕ ESC</span>
  </div>
  <div class="log" id="chatLog"></div>
  <form id="chatForm">
    <input type="text" id="chatInput" placeholder="Say something…" autocomplete="off">
    <button type="submit" id="chatSend">Send</button>
  </form>
</div>

<script>
'use strict';

// ============================================================================
// K: constants
// ============================================================================
const K = {
  TILE: 16,              // source tile size (px)
  SCALE: 3,              // render scale
  MAP_W: 48,
  MAP_H: 34,
  B_WATER: 0, B_SAND: 1, B_GRASS: 2,
};
K.TS = K.TILE * K.SCALE; // 48

// ============================================================================
// Canvas + DPR
// ============================================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = 1, VIEW_W = 0, VIEW_H = 0;
function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VIEW_W = window.innerWidth;
  VIEW_H = window.innerHeight;
  canvas.width = Math.floor(VIEW_W * DPR);
  canvas.height = Math.floor(VIEW_H * DPR);
  canvas.style.width = VIEW_W + 'px';
  canvas.style.height = VIEW_H + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================================
// Asset loader — Sprout Lands sheets
// ============================================================================
const SPROUT = 'assets/sprout-lands/';
// Each tile is 16×16. We load individual cutouts (pre-cropped by the pack
// author) rather than guessing indices in a composite atlas. Keys follow
// compass bitmask: NW/N/NE/W/MID/E/SW/S/SE. Missing "east flat" is aliased.
const GRASS_CUT = 'Tilesets/ground tiles/New tiles/simpel versions/Grass tiles v2 simple cutout/';
const SHEETS_MANIFEST = {
  // Grass cutouts (each 16×16)
  g_nw:  GRASS_CUT + 'Grass_tiles_v2_Corner_NortWest.png',
  g_n:   GRASS_CUT + 'Grass_tiles_v2_Flat_North.png',
  g_ne:  GRASS_CUT + 'Grass_tiles_v2_Corner_NorthEast.png',
  g_w:   GRASS_CUT + 'Grass_tiles_v2_Flat_West.png',
  g_mid: GRASS_CUT + 'Grass_tiles_v2_Mid.png',
  g_sw:  GRASS_CUT + 'Grass_tiles_v2_Corner_SouthWest.png',
  g_s:   GRASS_CUT + 'Grass_tiles_v2_Flat_South.png',
  g_se:  GRASS_CUT + 'Grass_tiles_v2_Corner_SouthEast.png',
  // variants sprinkled in grass interior
  g_flower1: GRASS_CUT + 'Grass_tiles_v2_Mid_Flowers1.png',
  g_flower2: GRASS_CUT + 'Grass_tiles_v2_Mid_Flowers2.png',
  g_sprout1: GRASS_CUT + 'Grass_tiles_v2_Mid_Sprouts1.png',
  g_sprout2: GRASS_CUT + 'Grass_tiles_v2_Mid_Sprouts2.png',
  g_moss1:   GRASS_CUT + 'Grass_tiles_v2_mMid_Moss1.png',
  g_moss2:   GRASS_CUT + 'Grass_tiles_v2_Mid_Moss2.png',
  // Sand (using the big atlas — single mid tile at pixel (16,16))
  sand: 'Tilesets/ground tiles/New tiles/Soil_Ground_Tiles.png',
  // Water (4 anim frames, each 16×16)
  water0: 'Tilesets/ground tiles/water frames/Water_1.png',
  water1: 'Tilesets/ground tiles/water frames/Water_2.png',
  water2: 'Tilesets/ground tiles/water frames/Water_3.png',
  water3: 'Tilesets/ground tiles/water frames/Water_4.png',
  // Buildings
  walls: 'Tilesets/Building parts/Wooden_House_Walls_Tilset.png',
  roofs: 'Tilesets/Building parts/Wooden_House_Roof_Tilset.png',
  // Objects — tree_sprites.png is 36×12 tiles: 4 growth stages stacked top→bottom
  // in 3-row bands. Bottom band (rows 9-11) holds 12 mature trees, each 3×3.
  trees: 'Objects/Tree animations/tree_sprites.png',
  well:  'Objects/Water well.png',
  workStation: 'Objects/work station.png',
  boats: 'Objects/Boats.png',
  flowers: 'Objects/Mushrooms, Flowers, Stones.png',
};
const S = {};
let loadedOK = 0, loadedFail = 0;
function loadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { loadedOK++; resolve(img); };
    img.onerror = () => { loadedFail++; console.warn('failed to load', url); resolve(null); };
    img.src = url;
  });
}
async function loadAllSheets() {
  const entries = Object.entries(SHEETS_MANIFEST);
  await Promise.all(entries.map(async ([k, v]) => {
    S[k] = await loadImage(SPROUT + encodeURI(v));
  }));
  S.water = [S.water0, S.water1, S.water2, S.water3];
  document.getElementById('assetStatus').textContent =
    loadedFail === 0 ? `ext:${loadedOK} loaded` : `ext:${loadedOK} · ${loadedFail} missing`;
}

// ============================================================================
// Procedural Claude sprites — kept from previous build
// ============================================================================
const PAL = {
  orange: '#E87040', orangeHi: '#F5A47D', orangeLo: '#b24818', orangeDark: '#6a2408',
  shadow: 'rgba(0,0,0,0.28)',
};
const CHAR_W = 20, CHAR_H = 28;

function makeCanvasEl(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c, g };
}
function rect(g, x, y, w, h, fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); }
function px(g, x, y, fill)          { g.fillStyle = fill; g.fillRect(x, y, 1, 1); }

function makeCharacter(spec) {
  const frames = [[], [], [], []];
  for (let d = 0; d < 4; d++)
    for (let f = 0; f < 4; f++)
      frames[d][f] = drawCharFrame(spec, d, f);
  return frames;
}
function drawCharFrame(spec, dir, frame) {
  const W = CHAR_W, H = CHAR_H;
  const { c, g } = makeCanvasEl(W, H);
  const cx = W / 2;
  const feetY = H - 3;
  const bob = (frame === 1 || frame === 3) ? -1 : 0;
  const stepA = frame === 1 ? 1 : frame === 3 ? -1 : 0;

  g.fillStyle = PAL.shadow;
  g.beginPath(); g.ellipse(cx, feetY + 1, 7, 2, 0, 0, Math.PI * 2); g.fill();

  const legY = feetY - 6 + bob;
  rect(g, cx - 4, legY, 3, 6, spec.legs);
  rect(g, cx + 1, legY, 3, 6, spec.legs);
  rect(g, cx - 4 + stepA, feetY - 1, 3, 2, spec.boots);
  rect(g, cx + 1 - stepA, feetY - 1, 3, 2, spec.boots);

  const bodyY = feetY - 16 + bob;
  rect(g, cx - 6, bodyY, 12, 12, spec.robe);
  rect(g, cx - 6, bodyY, 12, 2, spec.robeHi);
  rect(g, cx - 6, bodyY + 10, 12, 2, spec.robeLo);
  rect(g, cx - 7, bodyY + 7, 14, 2, spec.belt);
  px(g, cx, bodyY + 7, spec.accent);
  px(g, cx, bodyY + 8, spec.accent);

  const armSwing = frame === 1 ? 1 : frame === 3 ? -1 : 0;
  if (dir !== 1) {
    rect(g, cx + 6, bodyY + 2 + armSwing, 2, 8, spec.robe);
    rect(g, cx + 6, bodyY + 9 + armSwing, 2, 2, spec.skin);
  }
  if (dir !== 3) {
    rect(g, cx - 8, bodyY + 2 - armSwing, 2, 8, spec.robe);
    rect(g, cx - 8, bodyY + 9 - armSwing, 2, 2, spec.skin);
  }

  const headY = bodyY - 10;
  g.fillStyle = spec.robe;
  g.beginPath();
  g.moveTo(cx - 6, headY + 10); g.lineTo(cx - 7, headY + 3);
  g.lineTo(cx - 3, headY);      g.lineTo(cx + 3, headY);
  g.lineTo(cx + 7, headY + 3);  g.lineTo(cx + 6, headY + 10);
  g.closePath(); g.fill();

  if (dir === 0) {
    rect(g, cx - 4, headY + 3, 8, 7, spec.skin);
    rect(g, cx - 4, headY + 8, 8, 2, spec.skinShade);
    px(g, cx - 2, headY + 6, spec.eye);
    px(g, cx + 1, headY + 6, spec.eye);
    if (spec.eyeGlow) { px(g, cx - 2, headY + 5, spec.eyeGlow); px(g, cx + 1, headY + 5, spec.eyeGlow); }
    if (!spec.noMouth) rect(g, cx, headY + 8, 1, 1, spec.mouth || spec.skinShade);
  } else if (dir === 2) {
    rect(g, cx - 3, headY + 3, 6, 6, spec.robeLo);
    px(g, cx - 2, headY + 4, spec.robeHi);
    px(g, cx + 1, headY + 4, spec.robeHi);
  } else {
    const leftSide = dir === 1;
    rect(g, cx - 3, headY + 3, 6, 7, spec.skin);
    rect(g, cx - 3, headY + 8, 6, 2, spec.skinShade);
    const ex = leftSide ? cx - 2 : cx + 1;
    px(g, ex, headY + 6, spec.eye);
    if (spec.eyeGlow) px(g, ex, headY + 5, spec.eyeGlow);
  }

  if (spec.chestMark && dir !== 2) {
    const mx = cx, my = bodyY + 4;
    g.fillStyle = spec.chestMark;
    g.fillRect(mx, my - 2, 1, 5);
    g.fillRect(mx - 2, my, 5, 1);
    px(g, mx - 1, my - 1, spec.chestMark);
    px(g, mx + 1, my + 1, spec.chestMark);
    px(g, mx + 1, my - 1, spec.chestMark);
    px(g, mx - 1, my + 1, spec.chestMark);
    px(g, mx, my, '#fff0d0');
  }
  return c;
}

const SPEC_CLAUDE = {
  robe: PAL.orange, robeHi: PAL.orangeHi, robeLo: PAL.orangeLo,
  belt: PAL.orangeDark, accent: '#f0c040',
  legs: '#5a2a10', boots: '#2a1008',
  skin: '#2a1208', skinShade: '#180804',
  eye: PAL.orangeHi, eyeGlow: '#fff0d0',
  chestMark: PAL.orangeHi, noMouth: true,
};
const SPEC_PLAYER = {
  robe: '#3c6a8a', robeHi: '#76a6c8', robeLo: '#1c3a54',
  belt: '#2a1a10', accent: PAL.orange,
  legs: '#2a1a10', boots: '#1a1008',
  skin: '#e8b888', skinShade: '#a87248',
  eye: '#1a1008', eyeGlow: null,
  chestMark: null, noMouth: false,
};
const SPEC_MAYOR   = { ...SPEC_CLAUDE, robe: '#f07850', robeHi: '#ffb488', robeLo: '#c04820', accent: '#fff0c0' };
const SPEC_SMITH   = { ...SPEC_CLAUDE, robe: '#b24818', robeHi: '#e07848', robeLo: '#6a2408', accent: '#f0a040' };
const SPEC_ARCH    = { ...SPEC_CLAUDE, robe: '#c85828', robeHi: PAL.orange, robeLo: '#8a3010' };
const SPEC_HARBOR  = { ...SPEC_CLAUDE, robe: '#d86040', robeHi: '#f89068', robeLo: '#a03818' };

const A = {};
function buildSprites() {
  A.player = makeCharacter(SPEC_PLAYER);
  A.claude = makeCharacter(SPEC_CLAUDE);
  A.mayor  = makeCharacter(SPEC_MAYOR);
  A.smith  = makeCharacter(SPEC_SMITH);
  A.arch   = makeCharacter(SPEC_ARCH);
  A.harbor = makeCharacter(SPEC_HARBOR);
}

// ============================================================================
// Map / Island generation
// ============================================================================
const biome = new Uint8Array(K.MAP_W * K.MAP_H);
const decor = new Uint8Array(K.MAP_W * K.MAP_H);   // per-tile variant roll (for grass flowers etc.)
function bidx(x, y) { return y * K.MAP_W + x; }
function getBiome(x, y) {
  if (x < 0 || y < 0 || x >= K.MAP_W || y >= K.MAP_H) return K.B_WATER;
  return biome[bidx(x, y)];
}
function generateIsland() {
  const cx = K.MAP_W / 2, cy = K.MAP_H / 2;
  const radX = K.MAP_W * 0.42, radY = K.MAP_H * 0.42;
  for (let y = 0; y < K.MAP_H; y++) {
    for (let x = 0; x < K.MAP_W; x++) {
      const dx = (x - cx) / radX, dy = (y - cy) / radY;
      const r = Math.sqrt(dx * dx + dy * dy);
      // Noise for ragged coastline
      const n = 0.08 * Math.sin(x * 0.55 + y * 0.37) + 0.06 * Math.cos(x * 0.21 - y * 0.72);
      const effR = r + n;
      let b;
      if (effR < 0.82) b = K.B_GRASS;
      else if (effR < 0.97) b = K.B_SAND;
      else b = K.B_WATER;
      biome[bidx(x, y)] = b;
      // stable per-tile rng byte for choosing variants
      decor[bidx(x, y)] = ((x * 1103515245 + y * 12345 + 42) >>> 0) & 0xff;
    }
  }
}

// ============================================================================
// Buildings — 4 cottages on grass
// Each building is 3 tiles wide × 2 wall tiles tall + 2 roof tiles on top (4 tall total).
// Bottom-middle cell is the door / entry point.
// ============================================================================
// Walls sheet is 5×3 tiles — left 2 cols × 3 rows = one full cottage wall unit.
// Walls/roof sheets are 9-slice tilesets (edge strips + fill + corners). A
// cottage is assembled 3 wide × (4 roof + 3 walls) = 3×7 tall. See drawBuilding
// below for the exact tile picks.
const BLDG_W = 3, BLDG_H_WALL = 3, BLDG_H_ROOF = 4, BLDG_H = BLDG_H_WALL + BLDG_H_ROOF;
// Map is 48×34, island center ~ (24, 17). Buildings at N/E/S/W compass points.
// Door sits at dest col 1 (center) of bottom wall row → world (b.x + 1, b.y + BLDG_H - 1).
const buildings = [
  { id: 'hall',   name: 'Town Hall',    role: 'mayor',
    x: 23, y: 3,  label: 'Town Hall' },        // N — door at (24, 9)
  { id: 'lib',    name: 'Library',      role: 'archivist',
    x: 35, y: 13, label: 'Library' },          // E — door at (36, 19)
  { id: 'work',   name: 'Workshop',     role: 'tinker',
    x: 23, y: 22, label: 'Workshop' },         // S — door at (24, 28)
  { id: 'harbor', name: 'Harbor House', role: 'captain',
    x: 9,  y: 13, label: 'Harbor' },           // W — door at (10, 19)
];
function buildingBlocksTile(x, y) {
  for (const b of buildings) {
    const walTop = b.y + BLDG_H_ROOF;
    const walBot = walTop + BLDG_H_WALL;
    // Block the wall footprint (not the roof area — roof only paints, doesn't collide).
    if (x >= b.x && x < b.x + BLDG_W && y >= walTop && y < walBot) {
      // leave the door tile walkable so you can walk through
      const doorX = b.x + Math.floor(BLDG_W / 2);
      const doorY = walBot - 1;
      if (x === doorX && y === doorY) return false;
      return true;
    }
  }
  return false;
}
function buildingDoorWorld(b) {
  const walTop = b.y + BLDG_H_ROOF;
  const walBot = walTop + BLDG_H_WALL;
  return { x: b.x + Math.floor(BLDG_W / 2) + 0.5, y: walBot - 0.5 };
}

// ============================================================================
// Props — trees, flowers, well, workstation, boats
// ============================================================================
const props = []; // { kind, x, y, variant }
function scatterProps() {
  // Central well — visible from all four buildings in the compass layout.
  props.push({ kind: 'well', x: 24, y: 17.5 });
  // Workstation next to the workshop (south building).
  props.push({ kind: 'workstation', x: 26, y: 27 });
  // Boats along the south/east coast.
  props.push({ kind: 'boat', x: 42, y: 30, variant: 0 });
  props.push({ kind: 'boat', x: 40, y: 31, variant: 1 });

  // Trees scattered with grid-based min spacing so they don't overlap.
  const rnd = mulberry32(0x4caf50);
  const treePlacements = []; // tracks accepted tree positions
  const MIN_DIST = 3.2;      // min tile spacing — trees are 3 wide now
  const NEAR_BLDG_PAD = 1.4;

  function farFromTrees(x, y) {
    for (const t of treePlacements) {
      const dx = x - t.x, dy = y - t.y;
      if (dx * dx + dy * dy < MIN_DIST * MIN_DIST) return false;
    }
    return true;
  }
  function nearAnyBuilding(x, y) {
    for (const b of buildings) {
      if (x > b.x - NEAR_BLDG_PAD && x < b.x + BLDG_W + NEAR_BLDG_PAD &&
          y > b.y - NEAR_BLDG_PAD && y < b.y + BLDG_H + NEAR_BLDG_PAD) return true;
    }
    return false;
  }
  function nearAnyNpc(x, y) {
    for (const n of NPC_DEFS) {
      const dx = x - n.x, dy = y - n.y;
      if (dx * dx + dy * dy < 1.2 * 1.2) return true;
    }
    return false;
  }
  function nearCenterPath(x, y) {
    // keep a clear plaza around the well and the N-S / E-W corridors
    const dxc = x - 24, dyc = y - 17;
    if (dxc * dxc + dyc * dyc < 4 * 4) return true; // 4-tile radius plaza
    // N-S corridor between hall and workshop
    if (x > 22 && x < 26 && y > 8 && y < 27) return true;
    // E-W corridor between harbor and library
    if (y > 15 && y < 19 && x > 11 && x < 37) return true;
    return false;
  }

  for (let attempt = 0; attempt < 700; attempt++) {
    // biased sample toward integer-ish positions for a grid-ish feel
    const x = 2 + rnd() * (K.MAP_W - 4);
    const y = 2 + rnd() * (K.MAP_H - 4);
    const tx = Math.floor(x), ty = Math.floor(y);
    if (getBiome(tx, ty) !== K.B_GRASS) continue;
    if (buildingBlocksTile(tx, ty)) continue;
    if (nearAnyBuilding(x, y)) continue;
    if (nearCenterPath(x, y)) continue;
    if (nearAnyNpc(x, y)) continue;
    if (!farFromTrees(x, y)) continue;
    treePlacements.push({ x, y });
    props.push({ kind: 'tree', x, y, variant: (rnd() * 4) | 0 });
  }

  // Flowers / bushes sprinkled — no spacing constraint, but avoid trees.
  for (let attempt = 0; attempt < 120; attempt++) {
    const x = 2 + rnd() * (K.MAP_W - 4);
    const y = 2 + rnd() * (K.MAP_H - 4);
    const tx = Math.floor(x), ty = Math.floor(y);
    if (getBiome(tx, ty) !== K.B_GRASS) continue;
    if (buildingBlocksTile(tx, ty)) continue;
    if (nearCenterPath(x, y)) continue;
    let nearTree = false;
    for (const t of treePlacements) {
      const dx = x - t.x, dy = y - t.y;
      if (dx * dx + dy * dy < 1.0) { nearTree = true; break; }
    }
    if (nearTree) continue;
    props.push({ kind: 'flower', x, y, variant: (rnd() * 6) | 0 });
  }
}
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const npcs = NPC_DEFS.map(d => ({ ...d, frame: 0, frameTime: 0 }));

// ============================================================================
// Player
// ============================================================================
const player = {
  x: 24, y: 16.5,
  dir: 0, frame: 0, frameTime: 0,
  targetX: null, targetY: null,
  speed: 4.6, // tiles/sec
};

// ============================================================================
// Camera
// ============================================================================
const cam = { x: 0, y: 0 };
function updateCamera() {
  const worldW = K.MAP_W * K.TS;
  const worldH = K.MAP_H * K.TS;
  cam.x = player.x * K.TS - VIEW_W / 2;
  cam.y = player.y * K.TS - VIEW_H / 2;
  if (worldW > VIEW_W) cam.x = Math.max(0, Math.min(cam.x, worldW - VIEW_W));
  else cam.x = (worldW - VIEW_W) / 2;
  if (worldH > VIEW_H) cam.y = Math.max(0, Math.min(cam.y, worldH - VIEW_H));
  else cam.y = (worldH - VIEW_H) / 2;
}
function screenToWorld(sx, sy) {
  return { x: (sx + cam.x) / K.TS, y: (sy + cam.y) / K.TS };
}

// ============================================================================
// Input
// ============================================================================
const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.key === 'Escape') { closeChat(); }
  if ((k === 'e') && !isTyping()) { e.preventDefault(); tryInteract(); }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function isTyping() {
  const el = document.activeElement;
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
}

const mouse = { x: 0, y: 0, hoverNpc: null };
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const { x, y } = screenToWorld(sx, sy);
  // NPC clicked?
  const n = npcNear(x, y, 0.9);
  if (n) { openChat(n); return; }
  // else: click-to-move if walkable
  if (walkable(x, y)) {
    player.targetX = x;
    player.targetY = y;
  }
});

// ============================================================================
// Walkability
// ============================================================================
function walkable(x, y) {
  const bx = Math.floor(x), by = Math.floor(y);
  if (getBiome(bx, by) === K.B_WATER) return false;
  if (buildingBlocksTile(bx, by)) return false;
  // don't walk through NPCs
  for (const n of npcs) {
    const ddx = x - n.x, ddy = y - n.y;
    if (ddx * ddx + ddy * ddy < 0.35 * 0.35) return false;
  }
  return true;
}

function npcNear(x, y, r) {
  let best = null, bd = r * r;
  for (const n of npcs) {
    const dx = x - n.x, dy = y - n.y;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}

function tryInteract() {
  // find the nearest NPC within ~1 tile of the player
  const n = npcNear(player.x, player.y, 1.4);
  if (n) openChat(n);
}

// ============================================================================
// Update
// ============================================================================
function update(dt) {
  // player input
  let vx = 0, vy = 0;
  if (!isTyping()) {
    if (keys.w || keys.arrowup)    vy -= 1;
    if (keys.s || keys.arrowdown)  vy += 1;
    if (keys.a || keys.arrowleft)  vx -= 1;
    if (keys.d || keys.arrowright) vx += 1;
  }
  if (vx || vy) {
    player.targetX = null; player.targetY = null;
    const m = Math.sqrt(vx*vx + vy*vy) || 1;
    vx /= m; vy /= m;
  } else if (player.targetX !== null) {
    const dx = player.targetX - player.x;
    const dy = player.targetY - player.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < 0.08) {
      player.targetX = null; player.targetY = null;
    } else {
      vx = dx / d; vy = dy / d;
    }
  }
  if (vx || vy) {
    const speed = keys.shift ? player.speed * 1.6 : player.speed;
    const step = speed * dt;
    const nx = player.x + vx * step;
    const ny = player.y + vy * step;
    if (walkable(nx, player.y)) player.x = nx;
    else { vx = 0; }
    if (walkable(player.x, ny)) player.y = ny;
    else { vy = 0; }
    if (vx || vy) {
      if (Math.abs(vx) > Math.abs(vy)) player.dir = vx > 0 ? 3 : 1;
      else player.dir = vy > 0 ? 0 : 2;
      player.frameTime += dt;
      if (player.frameTime > 0.12) {
        player.frame = (player.frame + 1) % 4;
        player.frameTime = 0;
      }
    }
  } else {
    player.frame = 0;
  }

  // update prompt
  const near = npcNear(player.x, player.y, 1.4);
  const pEl = document.getElementById('prompt');
  if (near && !document.getElementById('chat').classList.contains('open')) {
    document.getElementById('promptText').textContent = 'talk to ' + near.name;
    pEl.classList.add('show');
  } else {
    pEl.classList.remove('show');
  }
}

// ============================================================================
// Render
// ============================================================================
let waterAnim = 0;
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // deep ocean base
  ctx.fillStyle = '#4a93a8';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const minTX = Math.max(0, Math.floor(cam.x / K.TS) - 1);
  const maxTX = Math.min(K.MAP_W - 1, Math.ceil((cam.x + VIEW_W) / K.TS) + 1);
  const minTY = Math.max(0, Math.floor(cam.y / K.TS) - 1);
  const maxTY = Math.min(K.MAP_H - 1, Math.ceil((cam.y + VIEW_H) / K.TS) + 1);

  // --- Ground pass 1: water (only on water tiles)
  const wFrame = Math.floor(waterAnim * 3) % 4;
  const wImg = S.water ? S.water[wFrame] : null;
  if (wImg) {
    for (let y = minTY; y <= maxTY; y++) {
      for (let x = minTX; x <= maxTX; x++) {
        if (biome[bidx(x, y)] === K.B_WATER) drawFull(wImg, x, y);
      }
    }
  }

  // --- Ground pass 2: sand — a single solid mid tile painted under all land.
  // Sample from Soil_Ground_Tiles.png at its MID pixel (col 1, row 1).
  if (S.sand) {
    for (let y = minTY; y <= maxTY; y++) {
      for (let x = minTX; x <= maxTX; x++) {
        const b = biome[bidx(x, y)];
        if (b !== K.B_WATER) drawAtlasTile(S.sand, 1, 1, x, y);
      }
    }
  }

  // --- Ground pass 3: grass — autotile by neighbor bitmask using cutouts.
  for (let y = minTY; y <= maxTY; y++) {
    for (let x = minTX; x <= maxTX; x++) {
      if (biome[bidx(x, y)] !== K.B_GRASS) continue;
      const img = grassTileFor(x, y);
      if (img) drawFull(img, x, y);
      // sprinkle flower/sprouts variants on interior grass only
      const T = getBiome(x, y - 1) === K.B_GRASS;
      const B = getBiome(x, y + 1) === K.B_GRASS;
      const L = getBiome(x - 1, y) === K.B_GRASS;
      const R = getBiome(x + 1, y) === K.B_GRASS;
      if (T && B && L && R) {
        const d = decor[bidx(x, y)];
        if (d < 28) {
          const variants = [S.g_flower1, S.g_flower2, S.g_sprout1, S.g_sprout2, S.g_moss1, S.g_moss2];
          const v = variants[d % variants.length];
          if (v) drawFull(v, x, y);
        }
      }
    }
  }

  // --- Depth-sorted entities: props + npcs + player (by y for back-to-front)
  const drawList = [];
  // Buildings: each appears at its footprint Y (top of walls).
  for (const b of buildings) {
    drawList.push({ kind: 'building', data: b, y: b.y + BLDG_H_ROOF + BLDG_H_WALL - 0.4 });
  }
  for (const p of props) {
    drawList.push({ kind: p.kind, data: p, y: p.y });
  }
  for (const n of npcs) {
    drawList.push({ kind: 'npc', data: n, y: n.y });
  }
  drawList.push({ kind: 'player', data: player, y: player.y });
  drawList.sort((a, b) => a.y - b.y);
  for (const it of drawList) {
    if (it.kind === 'building') drawBuilding(it.data);
    else if (it.kind === 'tree') drawTree(it.data);
    else if (it.kind === 'flower') drawFlower(it.data);
    else if (it.kind === 'well') drawWell(it.data);
    else if (it.kind === 'workstation') drawWorkStation(it.data);
    else if (it.kind === 'boat') drawBoat(it.data);
    else if (it.kind === 'npc') drawChar(it.data, false);
    else if (it.kind === 'player') drawChar(it.data, true);
  }

  // HUD overlays
  if (player.targetX !== null) {
    const sx = player.targetX * K.TS - cam.x;
    const sy = player.targetY * K.TS - cam.y;
    ctx.strokeStyle = 'rgba(232,112,64,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 8 + 2 * Math.sin(waterAnim * 8), 0, Math.PI * 2); ctx.stroke();
  }
  // Building labels
  ctx.textAlign = 'center';
  ctx.font = '600 11px "Fira Code", monospace';
  for (const b of buildings) {
    const x = (b.x + BLDG_W / 2) * K.TS - cam.x;
    const y = (b.y - 0.2) * K.TS - cam.y;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(b.label.toUpperCase(), x + 1, y + 1);
    ctx.fillStyle = '#f0e8d8';
    ctx.fillText(b.label.toUpperCase(), x, y);
  }
}

// Helpers
function drawFull(img, tx, ty) {
  // Draw full image (assumed 16×16) at tile (tx,ty).
  const px = tx * K.TS - cam.x;
  const py = ty * K.TS - cam.y;
  ctx.drawImage(img, 0, 0, K.TILE, K.TILE, px, py, K.TS, K.TS);
}
function drawAtlasTile(img, col, row, tx, ty) {
  const px = tx * K.TS - cam.x;
  const py = ty * K.TS - cam.y;
  ctx.drawImage(img, col * K.TILE, row * K.TILE, K.TILE, K.TILE, px, py, K.TS, K.TS);
}
// Pick the correct grass cutout by neighbor bitmask. Missing east-flat file
// falls back to the MID tile (grass interior shows clean even with no E edge).
function grassTileFor(x, y) {
  const T = getBiome(x, y - 1) === K.B_GRASS;
  const B = getBiome(x, y + 1) === K.B_GRASS;
  const L = getBiome(x - 1, y) === K.B_GRASS;
  const R = getBiome(x + 1, y) === K.B_GRASS;
  if (!T && !L) return S.g_nw;
  if (!T && !R) return S.g_ne;
  if (!B && !L) return S.g_sw;
  if (!B && !R) return S.g_se;
  if (!T) return S.g_n;
  if (!B) return S.g_s;
  if (!L) return S.g_w;
  if (!R) return S.g_mid; // no Flat_East cutout; mid reads fine next to sand
  return S.g_mid;
}

// --- Building (walls + roof composite)
// The Sprout Lands wall/roof sheets are SLICE tilesets (edges + fills + corners),
// not pre-composed panels. We build a 9-slice cottage by picking:
//   Walls (80×48, 5×3):
//     (0,0)=TL top-trim   (1,0)=top plank  (2,0)=TR top-trim
//     (0,1)=L edge-mid    (1,1)=brick win  (2,1)=R edge-mid
//     (0,2)=L edge-bot    (1,2)=plank bot  (2,2)=R edge-bot   (3,2)=door
//   Roof (112×80, 7×5):
//     (3,0)=peak-L        (4,0)=peak-R  (stand-alone 2-tile gable tip)
//     (0,1)=L edge-mid    (1,1)=shingle fill  (2,1)=R edge-mid
//     (0,2)=L edge        (1,2)=eave fill     (2,2)=R edge
//     (0,3)=L wood-eave   (1,3)=shingle       (2,3)=R wood-eave
function drawBuilding(b) {
  const wallX = b.x * K.TS - cam.x;
  const wallY = (b.y + BLDG_H_ROOF) * K.TS - cam.y;
  const T = K.TILE, S_ = K.TS; // source tile px, screen tile px
  const put = (img, sc, sr, dc, dr, sw=1, sh=1) =>
    ctx.drawImage(img, sc*T, sr*T, sw*T, sh*T,
      Math.round(wallX + dc*S_) - 0, Math.round(wallY + dr*S_), S_*sw, S_*sh);
  const putRoof = (img, sc, sr, dc, dr, sw=1, sh=1) =>
    ctx.drawImage(img, sc*T, sr*T, sw*T, sh*T,
      Math.round(b.x*S_ - cam.x + dc*S_), Math.round(b.y*S_ - cam.y + dr*S_), S_*sw, S_*sh);

  // --- Walls: 3 wide × 3 tall (left-trim, middle fill, right-trim); door centered on row 2.
  if (S.walls) {
    // Top row (plank trim)
    put(S.walls, 0, 0, 0, 0);   put(S.walls, 1, 0, 1, 0);   put(S.walls, 2, 0, 2, 0);
    // Middle row (brick window in center)
    put(S.walls, 0, 1, 0, 1);   put(S.walls, 1, 1, 1, 1);   put(S.walls, 2, 1, 2, 1);
    // Bottom row: left edge, door, right edge
    put(S.walls, 0, 2, 0, 2);   put(S.walls, 3, 2, 1, 2);   put(S.walls, 2, 2, 2, 2);
  } else {
    ctx.fillStyle = '#a67856'; ctx.fillRect(wallX, wallY, S_*3, S_*3);
  }

  // --- Roof: 3 wide × 4 tall. Row 0 = peak. Rows 1-2 = shingle body.
  // Row 3 = wood plank eave (bottom trim that sits on wall top).
  if (S.roofs) {
    // Peak row: (3,0)+(4,0) form the gable tip; extend with shingle on the right.
    putRoof(S.roofs, 3, 0, 0, 0);   putRoof(S.roofs, 4, 0, 1, 0);   putRoof(S.roofs, 1, 1, 2, 0);
    // Shingle body rows (tile the same 3-slice)
    for (let dr = 1; dr <= 2; dr++) {
      putRoof(S.roofs, 0, 1, 0, dr);  putRoof(S.roofs, 1, 1, 1, dr);  putRoof(S.roofs, 2, 1, 2, dr);
    }
    // Wood plank eave (row 2 of the sheet — c1r2 is horizontal planks)
    putRoof(S.roofs, 0, 2, 0, 3);     putRoof(S.roofs, 1, 2, 1, 3);     putRoof(S.roofs, 2, 2, 2, 3);
  } else {
    ctx.fillStyle = '#d26060'; ctx.fillRect(b.x*S_ - cam.x, b.y*S_ - cam.y, S_*3, S_*4);
  }
}

// tree_sprites.png is 576×192 (36×12 tiles) — 4 growth stages stacked top→bottom:
// rows 0-2 (sapling, 1 tree), rows 3-5 (small, 4), rows 6-8 (medium, 6),
// rows 9-11 (mature, 12). Each mature tree is 3×3 tiles. We sample row 9 and
// pick one of 12 variants. Anchor so the trunk base lands at (p.x, p.y + ~1).
function drawTree(p) {
  if (!S.trees) return;
  const w = 3, h = 3;
  const sCol = (p.variant % 12) * 3;
  const sRow = 9;
  const sX = sCol * K.TILE;
  const sY = sRow * K.TILE;
  const sW = w * K.TILE;
  const sH = h * K.TILE;
  // Center horizontally on p.x; anchor trunk bottom flush with tile bottom.
  const dx = (p.x - w / 2) * K.TS - cam.x;
  const dy = (p.y - h + 1) * K.TS - cam.y;
  ctx.drawImage(S.trees, sX, sY, sW, sH, dx, dy, w * K.TS, h * K.TS);
}

// --- Flowers: from Mushrooms/Flowers/Stones sheet (12x5 tiles). Single-tile sprites.
function drawFlower(p) {
  if (!S.flowers) return;
  const col = p.variant % 6;
  const row = (p.variant / 6) | 0;
  const dx = (p.x - 0.5) * K.TS - cam.x;
  const dy = (p.y - 0.5) * K.TS - cam.y;
  ctx.drawImage(S.flowers, col * K.TILE, row * K.TILE, K.TILE, K.TILE, dx, dy, K.TS, K.TS);
}

// --- Well: 32x32 = 2x2 tiles
function drawWell(p) {
  if (!S.well) return;
  const w = 2, h = 2;
  const dx = (p.x - w / 2) * K.TS - cam.x;
  const dy = (p.y - h + 0.3) * K.TS - cam.y;
  ctx.drawImage(S.well, 0, 0, 32, 32, dx, dy, w * K.TS, h * K.TS);
}

// --- Workstation: 32x32 = 2x2 tiles
function drawWorkStation(p) {
  if (!S.workStation) return;
  const w = 2, h = 2;
  const dx = (p.x - w / 2) * K.TS - cam.x;
  const dy = (p.y - h + 0.3) * K.TS - cam.y;
  ctx.drawImage(S.workStation, 0, 0, 32, 32, dx, dy, w * K.TS, h * K.TS);
}

// --- Boat: 144x96 sheet, multiple boats. Each boat is 3x3 tiles approx.
function drawBoat(p) {
  if (!S.boats) return;
  const w = 3, h = 2;
  const sCol = (p.variant || 0) % 3;
  const sRow = 0;
  const dx = (p.x - w / 2) * K.TS - cam.x;
  const dy = (p.y - h + 0.5) * K.TS - cam.y;
  ctx.drawImage(S.boats,
    sCol * 3 * K.TILE, sRow * 3 * K.TILE, w * K.TILE, h * K.TILE,
    dx, dy, w * K.TS, h * K.TS);
}

// --- Character draw
function drawChar(e, isPlayer) {
  const frames = isPlayer ? A.player : (A[e.sprite] || A.claude);
  const img = frames[e.dir][e.frame];
  const w = CHAR_W * K.SCALE, h = CHAR_H * K.SCALE;
  const dx = e.x * K.TS - cam.x - w / 2;
  const dy = e.y * K.TS - cam.y - h + K.TS * 0.5;
  ctx.drawImage(img, dx, dy, w, h);
}

// ============================================================================
// Chat drawer — API calls + session management (preserved)
// ============================================================================
const chat = {
  npc: null,
  history: new Map(),
  sessions: new Map(),
  turns: new Map(),
  sending: false,
};

function ensureHistory(n) {
  if (!chat.history.has(n.id)) chat.history.set(n.id, [{ role: 'npc', content: n.greet }]);
  return chat.history.get(n.id);
}
function ensureSession(n) {
  if (!chat.sessions.has(n.id)) {
    chat.sessions.set(n.id, crypto.randomUUID());
    chat.turns.set(n.id, 0);
  }
  return chat.sessions.get(n.id);
}

function openChat(n) {
  chat.npc = n;
  ensureHistory(n); ensureSession(n);
  document.getElementById('chat').classList.add('open');
  document.getElementById('chatName').textContent = n.name;
  document.getElementById('chatRole').textContent = n.role;
  const av = document.getElementById('chatAvatar');
  av.innerHTML = '';
  const frames = A[n.sprite] || A.claude;
  const ac = document.createElement('canvas');
  ac.width = CHAR_W; ac.height = CHAR_H;
  const ag = ac.getContext('2d');
  ag.imageSmoothingEnabled = false;
  ag.drawImage(frames[0][0], 0, 0);
  av.appendChild(ac);
  const termBtn = document.getElementById('chatTerm');
  termBtn.disabled = (chat.turns.get(n.id) || 0) === 0;
  termBtn.title = termBtn.disabled
    ? 'Send at least one message first — the terminal needs a real session to resume'
    : 'Continue this conversation in a real Claude Code terminal (forks the session)';
  renderChatLog();
  const input = document.getElementById('chatInput');
  input.value = '';
  setTimeout(() => input.focus(), 50);
}

function closeChat() {
  document.getElementById('chat').classList.remove('open');
  chat.npc = null;
}

function renderChatLog() {
  const log = document.getElementById('chatLog');
  log.innerHTML = '';
  if (!chat.npc) return;
  const hist = ensureHistory(chat.npc);
  for (const m of hist) {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'user' : m.role === 'sys' ? 'sys' : 'npc');
    if (m.role === 'npc') {
      const w = document.createElement('div');
      w.className = 'who'; w.textContent = chat.npc.name;
      div.appendChild(w);
    }
    const t = document.createElement('div');
    t.textContent = m.content;
    div.appendChild(t);
    log.appendChild(div);
  }
  log.scrollTop = log.scrollHeight;
}

async function sendChat(message) {
  if (chat.sending || !chat.npc) return;
  const n = chat.npc;
  const hist = ensureHistory(n);
  hist.push({ role: 'user', content: message });
  renderChatLog();
  chat.sending = true;
  const log = document.getElementById('chatLog');
  const thinking = document.createElement('div');
  thinking.className = 'msg npc thinking';
  thinking.textContent = n.name + ' is thinking';
  log.appendChild(thinking);
  log.scrollTop = log.scrollHeight;
  const sendBtn = document.getElementById('chatSend');
  sendBtn.disabled = true;
  try {
    const session_id = ensureSession(n);
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: n.role, message, session_id }),
    });
    const j = await r.json();
    hist.push({ role: 'npc', content: j.reply || j.error || '…' });
    chat.turns.set(n.id, (chat.turns.get(n.id) || 0) + 1);
  } catch (e) {
    hist.push({ role: 'sys', content: 'connection lost: ' + e.message });
  } finally {
    thinking.remove();
    chat.sending = false;
    sendBtn.disabled = false;
    renderChatLog();
    const termBtn = document.getElementById('chatTerm');
    if ((chat.turns.get(n.id) || 0) > 0) {
      termBtn.disabled = false;
      termBtn.title = 'Continue this conversation in a real Claude Code terminal (forks the session)';
    }
    document.getElementById('chatInput').focus();
  }
}

async function continueInTerminal() {
  if (!chat.npc) return;
  const sid = chat.sessions.get(chat.npc.id);
  if (!sid) return;
  const btn = document.getElementById('chatTerm');
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ opening';
  try {
    const r = await fetch('/api/open-terminal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid }),
    });
    const j = await r.json();
    if (j.ok) {
      btn.textContent = '✓ opened';
      const hist = ensureHistory(chat.npc);
      hist.push({ role: 'sys', content: '→ forked to terminal (this chat keeps its thread)' });
      renderChatLog();
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
    } else {
      btn.textContent = '✗ failed';
      const hist = ensureHistory(chat.npc);
      hist.push({ role: 'sys', content: 'terminal launch failed: ' + (j.error || 'unknown') });
      renderChatLog();
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 3000);
    }
  } catch (e) {
    btn.textContent = '✗ failed';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 3000);
  }
}

document.getElementById('chatClose').onclick = closeChat;
document.getElementById('chatTerm').onclick = continueInTerminal;
document.getElementById('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('chatInput');
  const v = input.value.trim();
  if (!v || chat.sending) return;
  input.value = '';
  sendChat(v);
});

// ============================================================================
// Main loop
// ============================================================================
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  waterAnim += dt;
  update(dt);
  updateCamera();
  render();
  requestAnimationFrame(loop);
}

// ============================================================================
// Start
// ============================================================================
(async function start() {
  buildSprites();
  generateIsland();
  scatterProps();
  await loadAllSheets();
  requestAnimationFrame(loop);
})();
</script>
